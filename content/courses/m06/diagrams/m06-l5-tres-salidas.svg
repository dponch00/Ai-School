<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 760" role="img" aria-labelledby="t d" font-family="Source Serif 4, Georgia, serif"><title id="t">Tres clases de salida para el dashboard</title><desc id="d">La cobertura del Sur es determinista y se reconcilia; la alerta de oportunidad atípica es estadística y revisa método y mediana; el párrafo para dirección es generativo y se comprueba contra el contrato.</desc><rect width="480" height="760" rx="18" fill="#FFFDF7"/><text x="28" y="48" font-family="Fraunces, Georgia, serif" font-size="23" font-weight="700" fill="#172A33">No todas las salidas se verifican igual</text><text x="28" y="76" font-size="16" fill="#4D6265">Tres pedidos para el dashboard de Altiplano.</text><g fill="#fff" stroke="#778984" stroke-width="2"><rect x="42" y="112" width="396" height="120" rx="13"/><rect x="42" y="258" width="396" height="120" rx="13"/><rect x="42" y="404" width="396" height="120" rx="13"/></g><g fill="#172A33"><text x="64" y="148" font-family="Fraunces, Georgia, serif" font-size="20" font-weight="700">Determinista</text><text x="64" y="177" font-size="16">Cobertura del Sur → reconciliar al centavo</text><text x="64" y="294" font-family="Fraunces, Georgia, serif" font-size="20" font-weight="700">Estadística</text><text x="64" y="323" font-size="16">Alerta atípica → método y mediana</text><text x="64" y="440" font-family="Fraunces, Georgia, serif" font-size="20" font-weight="700">Generativa</text><text x="64" y="469" font-size="16">Párrafo para dirección → contra contrato</text></g><path d="M240 232v26m0 120v26" stroke="#778984" stroke-width="3" fill="none"/><rect x="42" y="560" width="396" height="78" rx="13" fill="#172A33"/><text x="240" y="594" text-anchor="middle" fill="#FFFDF7" font-family="Fraunces, Georgia, serif" font-size="19" font-weight="700">Una cifra reconciliable no sale del modelo.</text><text x="240" y="702" text-anchor="middle" fill="#A94E2B" font-family="Fraunces, Georgia, serif" font-size="18" font-weight="700">La clase decide el check.</text></svg>
