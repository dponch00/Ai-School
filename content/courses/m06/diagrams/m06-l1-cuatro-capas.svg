<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 780" role="img" aria-labelledby="t d" font-family="Source Serif 4, Georgia, serif"><title id="t">Cuatro capas del dashboard de Altiplano</title><desc id="d">El motor de datos filtra y agrega, el código de cálculo produce cifras del contrato, la interfaz muestra y filtra lo recibido, y el modelo generativo redacta. Descargar 40 filas al navegador para calcular deja la cifra fuera del check.</desc><rect width="480" height="780" rx="18" fill="#FFFDF7"/><text x="28" y="48" font-family="Fraunces, Georgia, serif" font-size="23" font-weight="700" fill="#172A33">Cada operación tiene un lugar</text><text x="28" y="76" font-size="16" fill="#4D6265">Caso: cobertura por región de Altiplano.</text><g fill="#fff" stroke="#778984" stroke-width="2"><rect x="42" y="112" width="396" height="90" rx="13"/><rect x="42" y="222" width="396" height="90" rx="13"/><rect x="42" y="332" width="396" height="90" rx="13"/><rect x="42" y="442" width="396" height="90" rx="13"/></g><g fill="#172A33"><text x="64" y="148" font-family="Fraunces, Georgia, serif" font-size="19" font-weight="700">Motor de datos</text><text x="64" y="176" font-size="16">Filtra, une y agrega filas</text><text x="64" y="258" font-family="Fraunces, Georgia, serif" font-size="19" font-weight="700">Código de cálculo</text><text x="64" y="286" font-size="16">Reglas, montos exactos y contrato</text><text x="64" y="368" font-family="Fraunces, Georgia, serif" font-size="19" font-weight="700">Interfaz</text><text x="64" y="396" font-size="16">Muestra, ordena y filtra lo recibido</text><text x="64" y="478" font-family="Fraunces, Georgia, serif" font-size="19" font-weight="700">Modelo generativo</text><text x="64" y="506" font-size="16">Redacta; no produce cifras del contrato</text></g><rect x="42" y="567" width="396" height="85" rx="13" fill="#fff" stroke="#A53636" stroke-width="3"/><text x="64" y="602" fill="#A53636" font-size="16" font-weight="700">ERROR DEL CASO</text><text x="64" y="631" fill="#172A33" font-family="Fraunces, Georgia, serif" font-size="18" font-weight="700">40 filas al navegador para calcular</text><text x="240" y="722" text-anchor="middle" fill="#A94E2B" font-family="Fraunces, Georgia, serif" font-size="18" font-weight="700">Una cifra solo en pantalla no se reconcilia.</text></svg>
