<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 820" role="img" aria-labelledby="t d" font-family="Source Serif 4, Georgia, serif"><title id="t">Del snapshot RAW al contrato</title><desc id="d">El snapshot del 19 de octubre se conserva RAW, se limpia con reglas declaradas y se agrega para el dashboard. Ante una rareza se normaliza, se reporta y excluye o se detiene el cálculo según la política.</desc><rect width="480" height="820" rx="18" fill="#FFFDF7"/><text x="28" y="48" font-family="Fraunces, Georgia, serif" font-size="23" font-weight="700" fill="#172A33">El dato no se corrige a mano</text><text x="28" y="76" font-size="16" fill="#4D6265">Snapshot del 19 de octubre: 40 oportunidades.</text><rect x="48" y="112" width="384" height="75" rx="13" fill="#DCECF5" stroke="#006E74" stroke-width="3"/><text x="240" y="158" text-anchor="middle" fill="#172A33" font-family="Fraunces, Georgia, serif" font-size="20" font-weight="700">RAW · conservar</text><path d="M240 187v27" stroke="#778984" stroke-width="3" fill="none"/><rect x="48" y="231" width="384" height="75" rx="13" fill="#fff" stroke="#778984" stroke-width="2"/><text x="240" y="277" text-anchor="middle" fill="#172A33" font-family="Fraunces, Georgia, serif" font-size="20" font-weight="700">Limpiar · reglas declaradas</text><path d="M240 306v27" stroke="#778984" stroke-width="3" fill="none"/><rect x="48" y="350" width="384" height="75" rx="13" fill="#fff" stroke="#778984" stroke-width="2"/><text x="240" y="396" text-anchor="middle" fill="#172A33" font-family="Fraunces, Georgia, serif" font-size="20" font-weight="700">Agregar · dashboard</text><path d="M240 425v33" stroke="#778984" stroke-width="3" fill="none"/><rect x="42" y="475" width="396" height="174" rx="13" fill="#DCECF5" stroke="#006E74" stroke-width="3"/><text x="64" y="510" fill="#172A33" font-family="Fraunces, Georgia, serif" font-size="19" font-weight="700">Ante una rareza</text><text x="64" y="544" fill="#4D6265" font-size="16">«Negociacion» → normalizar con alias</text><text x="64" y="574" fill="#4D6265" font-size="16">OPP-1021 sin fecha → reportar y excluir</text><text x="64" y="604" fill="#4D6265" font-size="16">OPP-1012 sin política → detener cálculo</text><text x="240" y="719" text-anchor="middle" fill="#A94E2B" font-family="Fraunces, Georgia, serif" font-size="18" font-weight="700">El contrato fija forma; el código, sentido.</text></svg>
