<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 750" role="img" aria-labelledby="t d" font-family="Source Serif 4, Georgia, serif"><title id="t">Dos caminos para reconciliar una cifra</title><desc id="d">Desde el mismo snapshot sintético, el dashboard calcula una cifra y la reconciliación la recalcula por otro camino desde CSV RAW. OPP-1099, que cierra el día del snapshot, distingue menor de menor o igual.</desc><rect width="480" height="750" rx="18" fill="#FFFDF7"/><text x="28" y="48" font-family="Fraunces, Georgia, serif" font-size="23" font-weight="700" fill="#172A33">Dos caminos, una comparación</text><text x="28" y="76" font-size="16" fill="#4D6265">El mismo snapshot debe producir una cifra verificable.</text><rect x="48" y="112" width="384" height="74" rx="13" fill="#DCECF5" stroke="#006E74" stroke-width="3"/><text x="240" y="158" text-anchor="middle" fill="#172A33" font-family="Fraunces, Georgia, serif" font-size="20" font-weight="700">Snapshot sintético</text><path d="M160 186v42m160-42v42" stroke="#778984" stroke-width="3" fill="none"/><rect x="42" y="245" width="186" height="105" rx="13" fill="#fff" stroke="#778984" stroke-width="2"/><rect x="252" y="245" width="186" height="105" rx="13" fill="#fff" stroke="#778984" stroke-width="2"/><text x="135" y="282" text-anchor="middle" fill="#172A33" font-family="Fraunces, Georgia, serif" font-size="19" font-weight="700">Dashboard</text><text x="135" y="311" text-anchor="middle" fill="#4D6265" font-size="16">Código de cálculo</text><text x="345" y="282" text-anchor="middle" fill="#172A33" font-family="Fraunces, Georgia, serif" font-size="19" font-weight="700">Reconciliación</text><text x="345" y="311" text-anchor="middle" fill="#4D6265" font-size="16">Otro camino desde RAW</text><path d="M135 350v47m210-47v47" stroke="#778984" stroke-width="3" fill="none"/><rect x="48" y="414" width="384" height="88" rx="13" fill="#DCECF5" stroke="#006E74" stroke-width="3"/><text x="240" y="450" text-anchor="middle" fill="#172A33" font-family="Fraunces, Georgia, serif" font-size="19" font-weight="700">Comparar contrato y tolerancias</text><text x="240" y="478" text-anchor="middle" fill="#4D6265" font-size="16">Independencia: comparte reglas, no código</text><rect x="48" y="531" width="384" height="86" rx="13" fill="#fff" stroke="#A53636" stroke-width="3"/><text x="70" y="565" fill="#A53636" font-size="16" font-weight="700">CASO LÍMITE</text><text x="70" y="594" fill="#172A33" font-family="Fraunces, Georgia, serif" font-size="18" font-weight="700">OPP-1099 cierra el día del snapshot</text><text x="240" y="683" text-anchor="middle" fill="#A94E2B" font-family="Fraunces, Georgia, serif" font-size="18" font-weight="700">Un check solo detecta lo que sus datos prueban.</text></svg>
