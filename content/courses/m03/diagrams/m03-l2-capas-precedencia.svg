<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 760" role="img" aria-labelledby="t d" font-family="Source Serif 4, Georgia, serif"><title id="t">Capas de instrucciones del pipeline</title><desc id="d">Las instrucciones de organización, usuario, proyecto, subcarpeta y personales se leen como contexto; si dos reglas de moneda se contradicen, se elimina una en lugar de confiar en un orden.</desc><rect width="480" height="760" rx="18" fill="#FFFDF7"/><text x="28" y="48" font-family="Fraunces, Georgia, serif" font-size="23" font-weight="700" fill="#172A33">¿Qué instrucción gana?</text><text x="28" y="76" font-size="16" fill="#4D6265">El pipeline de Altiplano tiene capas, no una garantía.</text><g fill="#fff" stroke="#778984" stroke-width="2"><rect x="38" y="106" width="404" height="72" rx="13"/><rect x="50" y="192" width="380" height="72" rx="13"/><rect x="62" y="278" width="356" height="72" rx="13"/><rect x="74" y="364" width="332" height="72" rx="13"/><rect x="86" y="450" width="308" height="72" rx="13"/></g><g fill="#172A33" font-size="17"><text x="58" y="150" font-family="Fraunces, Georgia, serif" font-size="20" font-weight="700">Organización</text><text x="70" y="236" font-family="Fraunces, Georgia, serif" font-size="20" font-weight="700">Usuario</text><text x="82" y="322" font-family="Fraunces, Georgia, serif" font-size="20" font-weight="700">Proyecto · AGENTS.md</text><text x="94" y="408" font-family="Fraunces, Georgia, serif" font-size="20" font-weight="700">Subcarpeta SQL</text><text x="106" y="494" font-family="Fraunces, Georgia, serif" font-size="20" font-weight="700">Personal</text></g><path d="M240 532v36" stroke="#4D6265" stroke-width="3" fill="none"/><path d="M233 559l7 9 7-9" stroke="#4D6265" stroke-width="3" fill="none"/><rect x="38" y="580" width="404" height="92" rx="13" fill="#DCECF5" stroke="#006E74" stroke-width="3"/><text x="58" y="616" fill="#172A33" font-family="Fraunces, Georgia, serif" font-size="19" font-weight="700">USD ≠ moneda local</text><text x="58" y="644" fill="#4D6265" font-size="16">Dos reglas contradictorias se corrigen en el origen.</text><text x="240" y="722" text-anchor="middle" fill="#A94E2B" font-family="Fraunces, Georgia, serif" font-size="18" font-weight="700">Precedencia no es anulación.</text></svg>
