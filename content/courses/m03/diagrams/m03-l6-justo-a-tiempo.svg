<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 710" role="img" aria-labelledby="t d" font-family="Source Serif 4, Georgia, serif"><title id="t">Precargar o recuperar sobre el Sur</title><desc id="d">Para explicar la cobertura del Sur, precargar todo ocupa el contexto con diccionario, snapshots, historial y actas; recuperar justo a tiempo conserva referencias ligeras y trae solo el fragmento necesario.</desc><rect width="480" height="710" rx="18" fill="#FFFDF7"/><text x="28" y="48" font-family="Fraunces, Georgia, serif" font-size="23" font-weight="700" fill="#172A33">¿Todo ahora o justo a tiempo?</text><text x="28" y="76" font-size="16" fill="#4D6265">Pregunta: «¿Por qué cayó la cobertura del Sur?»</text><rect x="42" y="112" width="396" height="185" rx="13" fill="#fff" stroke="#A53636" stroke-width="3"/><text x="66" y="149" fill="#A53636" font-size="16" font-weight="700">PRECARGAR TODO</text><text x="66" y="184" fill="#172A33" font-family="Fraunces, Georgia, serif" font-size="20" font-weight="700">Contexto lleno antes de preguntar</text><text x="66" y="216" fill="#4D6265" font-size="16">Diccionario · dos snapshots · historial</text><text x="66" y="244" fill="#4D6265" font-size="16">Actas completas de reuniones</text><path d="M240 297v36" stroke="#778984" stroke-width="3" fill="none"/><path d="M233 324l7 9 7-9" stroke="#778984" stroke-width="3" fill="none"/><rect x="42" y="350" width="396" height="185" rx="13" fill="#DCECF5" stroke="#006E74" stroke-width="3"/><text x="66" y="387" fill="#006E74" font-size="16" font-weight="700">RECUPERAR JUSTO A TIEMPO</text><text x="66" y="422" fill="#172A33" font-family="Fraunces, Georgia, serif" font-size="20" font-weight="700">Referencia ligera primero</text><text x="66" y="454" fill="#4D6265" font-size="16">Ruta al snapshot y definición de cobertura</text><text x="66" y="482" fill="#4D6265" font-size="16">Solo el fragmento que responde la pregunta</text><text x="240" y="622" text-anchor="middle" fill="#A94E2B" font-family="Fraunces, Georgia, serif" font-size="18" font-weight="700">Trae menos, pero trae lo pertinente.</text></svg>
