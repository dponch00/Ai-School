<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 700" role="img" aria-labelledby="t d" font-family="Source Serif 4, Georgia, serif"><title id="t">Carga progresiva de la skill semanal</title><desc id="d">La skill de reconciliación semanal carga primero su nombre y descripción, al activarse su cuerpo y solo cuando hace falta los recursos sobre snapshots, etapas y duplicados.</desc><rect width="480" height="700" rx="18" fill="#FFFDF7"/><text x="28" y="48" font-family="Fraunces, Georgia, serif" font-size="23" font-weight="700" fill="#172A33">La skill no entra toda</text><text x="28" y="76" font-size="16" fill="#4D6265">El cierre semanal de Altiplano se carga por niveles.</text><rect x="48" y="116" width="384" height="112" rx="13" fill="#DCECF5" stroke="#006E74" stroke-width="3"/><text x="72" y="152" fill="#172A33" font-family="Fraunces, Georgia, serif" font-size="20" font-weight="700">Siempre visible</text><text x="72" y="181" fill="#4D6265" font-size="16">Nombre y descripción de la skill</text><path d="M240 228v35" stroke="#778984" stroke-width="3" fill="none"/><path d="M233 254l7 9 7-9" stroke="#778984" stroke-width="3" fill="none"/><rect x="48" y="280" width="384" height="112" rx="13" fill="#fff" stroke="#778984" stroke-width="2"/><text x="72" y="316" fill="#172A33" font-family="Fraunces, Georgia, serif" font-size="20" font-weight="700">Al activarse</text><text x="72" y="345" fill="#4D6265" font-size="16">Cuerpo: comparar snapshot y recalcular USD</text><path d="M240 392v35" stroke="#778984" stroke-width="3" fill="none"/><path d="M233 418l7 9 7-9" stroke="#778984" stroke-width="3" fill="none"/><rect x="48" y="444" width="384" height="112" rx="13" fill="#fff" stroke="#778984" stroke-width="2"/><text x="72" y="480" fill="#172A33" font-family="Fraunces, Georgia, serif" font-size="20" font-weight="700">Solo si se piden</text><text x="72" y="509" fill="#4D6265" font-size="16">Recursos: etapas, duplicados y referencias</text><text x="240" y="636" text-anchor="middle" fill="#A94E2B" font-family="Fraunces, Georgia, serif" font-size="18" font-weight="700">Cargar menos deja espacio para trabajar.</text></svg>
