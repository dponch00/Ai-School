<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 850" role="img" aria-labelledby="t d" font-family="Source Serif 4, Georgia, serif"><title id="t">Cuatro preguntas para ubicar una regla</title><desc id="d">Cuatro preguntas ordenan las piezas del pipeline de Altiplano: pruebas siempre en la instrucción permanente, convenciones SQL por rutas, cierre semanal en una skill y la prohibición de editar probabilidades en un control determinista.</desc><rect width="480" height="850" rx="18" fill="#FFFDF7"/><text x="28" y="48" font-family="Fraunces, Georgia, serif" font-size="23" font-weight="700" fill="#172A33">Cada regla, en su capa</text><text x="28" y="76" font-size="16" fill="#4D6265">Las cuatro piezas del pipeline toman rutas distintas.</text><g fill="#fff" stroke="#778984" stroke-width="2"><rect x="34" y="105" width="412" height="112" rx="13"/><rect x="34" y="250" width="412" height="112" rx="13"/><rect x="34" y="395" width="412" height="112" rx="13"/><rect x="34" y="540" width="412" height="112" rx="13"/></g><g fill="#172A33"><text x="56" y="140" font-family="Fraunces, Georgia, serif" font-size="19" font-weight="700">¿Hace falta en cada sesión?</text><text x="56" y="169" font-size="16">Pruebas y reconciliación → instrucción permanente</text><text x="56" y="285" font-family="Fraunces, Georgia, serif" font-size="19" font-weight="700">¿Vale solo para una parte?</text><text x="56" y="314" font-size="16">Convención SQL → regla por rutas</text><text x="56" y="430" font-family="Fraunces, Georgia, serif" font-size="19" font-weight="700">¿Es un procedimiento ocasional?</text><text x="56" y="459" font-size="16">Cierre semanal → skill</text><text x="56" y="575" font-family="Fraunces, Georgia, serif" font-size="19" font-weight="700">¿Debe ocurrir sin excepción?</text><text x="56" y="604" font-size="16">No editar probabilidades → permiso o hook</text></g><path d="M240 217v26m0 119v26m0 119v26" stroke="#778984" stroke-width="3" fill="none"/><rect x="52" y="693" width="376" height="78" rx="13" fill="#DCECF5" stroke="#006E74" stroke-width="3"/><text x="240" y="727" text-anchor="middle" fill="#172A33" font-family="Fraunces, Georgia, serif" font-size="19" font-weight="700">Cada pieza vive una vez.</text><text x="240" y="752" text-anchor="middle" fill="#4D6265" font-size="16">Evita duplicar reglas y contradicciones.</text><text x="240" y="816" text-anchor="middle" fill="#A94E2B" font-family="Fraunces, Georgia, serif" font-size="18" font-weight="700">Primero pregunta, luego escribe.</text></svg>
