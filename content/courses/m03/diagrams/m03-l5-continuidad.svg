<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 720" role="img" aria-labelledby="t d" font-family="Source Serif 4, Georgia, serif"><title id="t">Lo que pasa del viernes al lunes</title><desc id="d">La sesión del viernes termina sin que el compañero recuerde su chat; los artefactos escritos transmiten la decisión de conservar el duplicado más reciente, el estado y la verificación al lunes.</desc><rect width="480" height="720" rx="18" fill="#FFFDF7"/><text x="28" y="48" font-family="Fraunces, Georgia, serif" font-size="23" font-weight="700" fill="#172A33">Del viernes al lunes</text><text x="28" y="76" font-size="16" fill="#4D6265">El chat no viaja; los archivos sí.</text><rect x="48" y="112" width="384" height="96" rx="13" fill="#DCECF5" stroke="#006E74" stroke-width="3"/><text x="72" y="148" fill="#172A33" font-family="Fraunces, Georgia, serif" font-size="20" font-weight="700">Viernes · sesión termina</text><text x="72" y="176" fill="#4D6265" font-size="16">FP&amp;A aprueba conservar actividad más reciente.</text><path d="M240 208v29" stroke="#778984" stroke-width="3" fill="none"/><g fill="#fff" stroke="#778984" stroke-width="2"><rect x="48" y="250" width="384" height="70" rx="13"/><rect x="48" y="338" width="384" height="70" rx="13"/><rect x="48" y="426" width="384" height="70" rx="13"/></g><g fill="#172A33"><text x="70" y="293" font-family="Fraunces, Georgia, serif" font-size="19" font-weight="700">Registro de decisiones</text><text x="70" y="381" font-family="Fraunces, Georgia, serif" font-size="19" font-weight="700">Traspaso: estado y siguiente paso</text><text x="70" y="469" font-family="Fraunces, Georgia, serif" font-size="19" font-weight="700">Comando de reconciliación</text></g><path d="M240 320v18m0 70v18m0 70v18" stroke="#778984" stroke-width="3" fill="none"/><rect x="48" y="534" width="384" height="70" rx="13" fill="#172A33"/><text x="240" y="577" text-anchor="middle" fill="#FFFDF7" font-family="Fraunces, Georgia, serif" font-size="20" font-weight="700">Lunes · verificar antes de seguir</text><text x="240" y="666" text-anchor="middle" fill="#A94E2B" font-family="Fraunces, Georgia, serif" font-size="18" font-weight="700">La continuidad se escribe.</text></svg>
