<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 735" role="img" aria-labelledby="t d" font-family="Source Serif 4, Georgia, serif">
  <title id="t">RAG para texto y consulta para cifras</title>
  <desc id="d">La política de FP y A responde qué cuenta como oportunidad vencida mediante documentos recuperados. El pipeline abierto del Sur se obtiene mediante una consulta estructurada que devuelve filas y totales repetibles.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#172A33" stroke-width="2"/></marker></defs>
  <rect width="480" height="735" rx="18" fill="#FFFDF7"/>
  <text x="28" y="46" font-family="Fraunces, Georgia, serif" font-size="23" font-weight="700" fill="#172A33">La vía depende de la pregunta</text>
  <text x="28" y="73" font-size="16" fill="#4D6265">Caso: preguntas de la directora de Altiplano.</text>
  <rect x="42" y="105" width="396" height="60" rx="13" fill="#fff" stroke="#778984" stroke-width="2"/>
  <text x="240" y="142" text-anchor="middle" font-size="17" fill="#172A33">¿Qué cuenta como oportunidad vencida?</text>
  <path d="M240 165v28" stroke="#172A33" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <rect x="42" y="208" width="396" height="81" rx="13" fill="#006E74"/>
  <text x="240" y="241" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="20" font-weight="700" fill="#fff">RAG: documentos</text><text x="240" y="266" text-anchor="middle" font-size="15" fill="#fff">Recupera el fragmento de la política</text>
  <path d="M240 289v28" stroke="#4D6265" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <rect x="42" y="332" width="396" height="59" rx="13" fill="#fff" stroke="#778984" stroke-width="2"/>
  <text x="240" y="369" text-anchor="middle" font-size="16" fill="#172A33">Definición y explicación con cita</text>
  <rect x="42" y="457" width="396" height="60" rx="13" fill="#fff" stroke="#778984" stroke-width="2"/>
  <text x="240" y="494" text-anchor="middle" font-size="17" fill="#172A33">¿Cuánto pipeline abierto tiene el Sur?</text>
  <path d="M240 517v28" stroke="#172A33" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <rect x="42" y="560" width="396" height="81" rx="13" fill="#DCECF5" stroke="#778984" stroke-width="2"/>
  <text x="240" y="593" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="20" font-weight="700" fill="#172A33">Consulta estructurada</text><text x="240" y="618" text-anchor="middle" font-size="15" fill="#172A33">Filas, conversión y total repetible</text>
  <path d="M240 641v28" stroke="#4D6265" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <text x="240" y="699" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="700" fill="#A94E2B">Una cifra no sale de texto recuperado.</text>
</svg>
