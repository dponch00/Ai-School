<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 670" role="img" aria-labelledby="t d" font-family="Source Serif 4, Georgia, serif">
  <title id="t">Los tres papeles de MCP</title>
  <desc id="d">En Altiplano, el anfitrión contiene al modelo y a un cliente para el servidor del CRM. El anfitrión aplica seguridad y consentimiento, limita el contexto que comparte, y el servidor ofrece herramientas, recursos y prompts.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#172A33" stroke-width="2"/></marker></defs>
  <rect width="480" height="670" rx="18" fill="#FFFDF7"/>
  <text x="28" y="46" font-family="Fraunces, Georgia, serif" font-size="23" font-weight="700" fill="#172A33">MCP: tres papeles</text>
  <text x="28" y="73" font-size="16" fill="#4D6265">Caso: el servidor del CRM de Altiplano.</text>
  <rect x="42" y="108" width="396" height="224" rx="15" fill="#DCECF5" stroke="#006E74" stroke-width="3"/>
  <text x="66" y="141" font-family="Fraunces, Georgia, serif" font-size="20" font-weight="700" fill="#172A33">Anfitrión</text>
  <text x="66" y="168" font-size="16" fill="#172A33">Modelo • políticas • consentimiento</text>
  <rect x="66" y="194" width="348" height="105" rx="13" fill="#006E74"/>
  <text x="240" y="229" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="19" font-weight="700" fill="#fff">Cliente del CRM</text><text x="240" y="255" text-anchor="middle" font-size="15" fill="#fff">Comparte solo el contexto necesario</text><text x="240" y="279" text-anchor="middle" font-size="15" fill="#fff">Pide consentimiento</text>
  <path d="M240 332v36" stroke="#172A33" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <text x="254" y="357" font-size="15" fill="#4D6265">JSON-RPC</text>
  <rect x="42" y="385" width="396" height="151" rx="15" fill="#fff" stroke="#778984" stroke-width="2"/>
  <text x="66" y="422" font-family="Fraunces, Georgia, serif" font-size="20" font-weight="700" fill="#172A33">Servidor del CRM</text>
  <text x="66" y="451" font-size="16" fill="#172A33">Ofrece capacidades:</text><text x="84" y="479" font-size="16" fill="#172A33">Herramientas · recursos · prompts</text><text x="66" y="509" font-size="15" fill="#4D6265">Sus descripciones no deciden la seguridad.</text>
  <path d="M240 536v33" stroke="#4D6265" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <rect x="42" y="584" width="396" height="42" rx="13" fill="#F5F0E6" stroke="#778984" stroke-width="2"/>
  <text x="240" y="611" text-anchor="middle" font-size="16" fill="#172A33">Herramienta, recurso o resultado</text>
  <text x="240" y="657" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="700" fill="#A94E2B">MCP no garantiza la seguridad.</text>
</svg>
