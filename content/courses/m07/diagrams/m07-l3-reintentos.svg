<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 755" role="img" aria-labelledby="t d" font-family="Source Serif 4, Georgia, serif">
  <title id="t">Reintentar un POST sin crear dos tareas</title>
  <desc id="d">Para crear una tarea de seguimiento, el agente genera una clave de idempotencia una vez. Si la petición falla, espera y reintenta con la misma clave y el mismo cuerpo; el servidor reconoce el reintento y evita un segundo efecto.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#172A33" stroke-width="2"/></marker></defs>
  <rect width="480" height="755" rx="18" fill="#FFFDF7"/>
  <text x="28" y="46" font-family="Fraunces, Georgia, serif" font-size="23" font-weight="700" fill="#172A33">Reintentar sin duplicar</text>
  <text x="28" y="73" font-size="16" fill="#4D6265">Caso: crear una tarea de seguimiento.</text>
  <rect x="46" y="106" width="388" height="71" rx="13" fill="#006E74"/>
  <text x="240" y="136" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="19" font-weight="700" fill="#fff">Generar una clave única</text><text x="240" y="158" text-anchor="middle" font-size="15" fill="#fff">Una por operación</text>
  <path d="M240 177v29" stroke="#172A33" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <rect x="42" y="221" width="396" height="82" rx="13" fill="#fff" stroke="#778984" stroke-width="2"/>
  <text x="63" y="250" font-family="Fraunces, Georgia, serif" font-size="18" font-weight="700" fill="#172A33">POST /tasks</text><text x="63" y="274" font-size="16" fill="#172A33">Misma clave y mismo cuerpo en cada intento</text>
  <path d="M240 303v30" stroke="#172A33" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <rect x="42" y="348" width="396" height="72" rx="13" fill="#F5F0E6" stroke="#778984" stroke-width="2"/>
  <text x="63" y="378" font-family="Fraunces, Georgia, serif" font-size="18" font-weight="700" fill="#172A33">Tiempo agotado o 503</text><text x="63" y="401" font-size="15" fill="#4D6265">No dice si el primer intento se aplicó.</text>
  <path d="M240 420v30" stroke="#4D6265" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <rect x="42" y="465" width="396" height="73" rx="13" fill="#fff" stroke="#778984" stroke-width="2"/>
  <text x="63" y="495" font-family="Fraunces, Georgia, serif" font-size="18" font-weight="700" fill="#172A33">Esperar y reintentar pocas veces</text><text x="63" y="518" font-size="15" fill="#4D6265">Si viene Retry-After, ese tiempo manda.</text>
  <path d="M240 538v30" stroke="#172A33" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <rect x="42" y="583" width="396" height="73" rx="13" fill="#DCECF5" stroke="#778984" stroke-width="2"/>
  <text x="63" y="612" font-family="Fraunces, Georgia, serif" font-size="18" font-weight="700" fill="#172A33">Servidor reconoce la clave</text><text x="63" y="636" font-size="15" fill="#172A33">Un efecto: una tarea creada</text>
  <rect x="42" y="670" width="396" height="43" rx="13" fill="#fff" stroke="#A53636" stroke-width="2"/>
  <text x="240" y="698" text-anchor="middle" font-size="16" fill="#A53636">409: la original sigue en curso; se espera.</text>
  <text x="240" y="742" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="700" fill="#A94E2B">Misma clave, no un segundo efecto.</text>
</svg>
