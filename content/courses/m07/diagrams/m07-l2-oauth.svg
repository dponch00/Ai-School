<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 790" role="img" aria-labelledby="t d" font-family="Source Serif 4, Georgia, serif">
  <title id="t">OAuth entrega un token limitado, no la contraseña</title>
  <desc id="d">La persona autoriza a la aplicación de Altiplano. El servidor de autorización emite un token con opportunities:read, que la aplicación presenta al servidor de recursos para leer oportunidades sin recibir la contraseña.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#172A33" stroke-width="2"/></marker></defs>
  <rect width="480" height="790" rx="18" fill="#FFFDF7"/>
  <text x="28" y="46" font-family="Fraunces, Georgia, serif" font-size="23" font-weight="700" fill="#172A33">Un token, no tu contraseña</text>
  <text x="28" y="73" font-size="16" fill="#4D6265">Caso: lectura del CRM para el comentario.</text>
  <rect x="52" y="105" width="376" height="63" rx="13" fill="#fff" stroke="#778984" stroke-width="2"/>
  <text x="240" y="134" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="19" font-weight="700" fill="#172A33">Persona: dueña del recurso</text><text x="240" y="155" text-anchor="middle" font-size="15" fill="#4D6265">Da consentimiento</text>
  <path d="M240 168v32" stroke="#172A33" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <rect x="52" y="214" width="376" height="72" rx="13" fill="#DCECF5" stroke="#778984" stroke-width="2"/>
  <text x="240" y="244" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="19" font-weight="700" fill="#172A33">Cliente: aplicación de Altiplano</text><text x="240" y="266" text-anchor="middle" font-size="15" fill="#4D6265">Pide acceso limitado</text>
  <path d="M240 286v31" stroke="#172A33" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <rect x="52" y="331" width="376" height="73" rx="13" fill="#006E74"/>
  <text x="240" y="361" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="19" font-weight="700" fill="#fff">Servidor de autorización</text><text x="240" y="383" text-anchor="middle" font-size="15" fill="#fff">Emite el token y su alcance</text>
  <path d="M240 404v31" stroke="#4D6265" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <rect x="52" y="449" width="376" height="78" rx="13" fill="#fff" stroke="#778984" stroke-width="2"/>
  <text x="240" y="479" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="19" font-weight="700" fill="#172A33">Token concedido</text><text x="240" y="503" text-anchor="middle" font-size="16" fill="#172A33">opportunities:read</text>
  <path d="M240 527v31" stroke="#172A33" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <rect x="52" y="572" width="376" height="72" rx="13" fill="#DCECF5" stroke="#778984" stroke-width="2"/>
  <text x="240" y="602" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="19" font-weight="700" fill="#172A33">Servidor de recursos</text><text x="240" y="624" text-anchor="middle" font-size="15" fill="#4D6265">Acepta el token para leer oportunidades</text>
  <path d="M240 644v31" stroke="#4D6265" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <rect x="52" y="689" width="376" height="45" rx="13" fill="#fff" stroke="#778984" stroke-width="2"/>
  <text x="240" y="718" text-anchor="middle" font-size="16" fill="#172A33">La aplicación recibe datos, no la contraseña.</text>
  <text x="240" y="774" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="700" fill="#A94E2B">Cuenta el alcance concedido, no el pedido.</text>
</svg>
