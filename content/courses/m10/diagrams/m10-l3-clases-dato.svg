<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 770" role="img" aria-labelledby="t d" font-family="Source Serif 4, Georgia, serif">
  <title id="t">Cuatro clases de dato y dónde viven</title>
  <desc id="d">En el Pulse, el total de vencidas es derivado y no se guarda; monto, etapa y fechas son de referencia del snapshot verificado; región y orden son preferencias; la marca revisada la crea el usuario y se guarda en el navegador con exportación.</desc>
  <rect width="480" height="770" rx="18" fill="#FFFDF7"/>
  <text x="28" y="46" font-family="Fraunces, Georgia, serif" font-size="23" font-weight="700" fill="#172A33">Cada dato vive donde corresponde</text>
  <text x="28" y="73" font-size="16" fill="#4D6265">Caso: la marca «revisada» en el Pulse.</text>
  <g fill="#fff" stroke="#778984" stroke-width="2"><rect x="42" y="107" width="396" height="112" rx="13"/><rect x="42" y="234" width="396" height="112" rx="13"/><rect x="42" y="361" width="396" height="112" rx="13"/><rect x="42" y="488" width="396" height="134" rx="13"/></g>
  <g fill="#172A33"><text x="63" y="139" font-family="Fraunces, Georgia, serif" font-size="19" font-weight="700">Derivado</text><text x="63" y="165" font-size="16">Total de vencidas de la región</text><text x="63" y="189" font-size="15" fill="#4D6265">No se guarda: se calcula o se lee del contrato.</text><text x="63" y="266" font-family="Fraunces, Georgia, serif" font-size="19" font-weight="700">De referencia</text><text x="63" y="292" font-size="16">Monto, etapa y fechas de oportunidad</text><text x="63" y="316" font-size="15" fill="#4D6265">Snapshot verificado; la app no lo edita.</text><text x="63" y="393" font-family="Fraunces, Georgia, serif" font-size="19" font-weight="700">Preferencia</text><text x="63" y="419" font-size="16">Región elegida, orden de la tabla</text><text x="63" y="443" font-size="15" fill="#4D6265">Almacenamiento simple; vuelve al valor por defecto.</text><text x="63" y="520" font-family="Fraunces, Georgia, serif" font-size="19" font-weight="700">Creado por el usuario</text><text x="63" y="546" font-size="16">Marca «revisada»</text><text x="63" y="570" font-size="15" fill="#4D6265">Navegador, con forma de exportarlo.</text><text x="63" y="597" font-size="15" fill="#4D6265">Es lo que no se puede reconstruir.</text></g>
  <text x="240" y="679" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="18" font-weight="700" fill="#A94E2B">Guardar una copia crea otro dato que mantener.</text>
  <text x="240" y="714" text-anchor="middle" font-size="16" fill="#4D6265">Guarda el código de la oportunidad, no su monto.</text>
</svg>
