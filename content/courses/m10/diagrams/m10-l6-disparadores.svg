<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 890" role="img" aria-labelledby="t d" font-family="Source Serif 4, Georgia, serif">
  <title id="t">Cada cambio dispara una comprobación</title>
  <desc id="d">En el Pulse, código o pantalla disparan pruebas, reconcile.py, accesibilidad y revisión manual. Instrucciones, skills, modelos, dependencias, formatos y hosting disparan sus comprobaciones específicas antes de que una persona distinta revise el resultado.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#172A33" stroke-width="2"/></marker></defs>
  <rect width="480" height="890" rx="18" fill="#FFFDF7"/>
  <text x="28" y="41" font-family="Fraunces, Georgia, serif" font-size="21" font-weight="700" fill="#172A33">Cada cambio dispara</text>
  <text x="28" y="65" font-family="Fraunces, Georgia, serif" font-size="21" font-weight="700" fill="#172A33">una prueba distinta</text>
  <text x="28" y="91" font-size="16" fill="#4D6265">Caso: plan de mantenimiento del Pulse.</text>
  <g fill="#fff" stroke="#778984" stroke-width="2"><rect x="42" y="107" width="396" height="91" rx="13"/><rect x="42" y="212" width="396" height="91" rx="13"/><rect x="42" y="317" width="396" height="91" rx="13"/><rect x="42" y="422" width="396" height="91" rx="13"/><rect x="42" y="527" width="396" height="91" rx="13"/><rect x="42" y="632" width="396" height="91" rx="13"/></g>
  <g fill="#172A33"><text x="63" y="136" font-family="Fraunces, Georgia, serif" font-size="18" font-weight="700">Código o pantalla</text><text x="63" y="160" font-size="15">Pruebas, reconcile.py, accesibilidad y revisión</text><text x="63" y="185" font-size="15">manual si cambia la pantalla</text><text x="63" y="241" font-family="Fraunces, Georgia, serif" font-size="18" font-weight="700">Instrucciones o skill</text><text x="63" y="265" font-size="15">Evaluaciones contra versión anterior y regresión</text><text x="63" y="346" font-family="Fraunces, Georgia, serif" font-size="18" font-weight="700">Modelo o su versión</text><text x="63" y="370" font-size="15">Evaluaciones y regresión completas, antes del retiro</text><text x="63" y="451" font-family="Fraunces, Georgia, serif" font-size="18" font-weight="700">Dependencia</text><text x="63" y="475" font-size="15">Pruebas completas, licencia y cambios incompatibles</text><text x="63" y="556" font-family="Fraunces, Georgia, serif" font-size="18" font-weight="700">Datos o exportación</text><text x="63" y="580" font-size="15">Prueba de migración con datos de versión anterior</text><text x="63" y="661" font-family="Fraunces, Georgia, serif" font-size="18" font-weight="700">Hosting o dirección</text><text x="63" y="685" font-size="15">Runbook de publicación y plan de mudanza</text></g>
  <path d="M240 723v30" stroke="#172A33" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <rect x="42" y="768" width="396" height="57" rx="13" fill="#DCECF5" stroke="#778984" stroke-width="2"/>
  <text x="240" y="794" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="700" fill="#172A33">Revisa otra persona</text><text x="240" y="815" text-anchor="middle" font-size="15" fill="#4D6265">Distinta de quien encargó el cambio.</text>
  <text x="240" y="869" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="700" fill="#A94E2B">Lo que no tiene disparador se revisa con fecha.</text>
</svg>
