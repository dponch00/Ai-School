<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 670" role="img" aria-labelledby="title desc">
  <title id="title">La forma no es la verdad</title>
  <desc id="desc">Una respuesta puede cumplir el formato acordado y aun así contener un valor incorrecto, por eso se comprueba tanto la forma como el sentido.</desc>
  <rect width="480" height="670" rx="18" fill="#FFFDF7"/>
  <text x="36" y="52" fill="#172A33" font-family="Fraunces, Georgia, serif" font-size="23" font-weight="700">La forma no es la verdad</text>
  <text x="36" y="81" fill="#4D6265" font-family="Source Serif 4, Georgia, serif" font-size="16">Una estructura válida no garantiza un dato correcto.</text>
  <rect x="48" y="120" width="384" height="116" rx="14" fill="#172A33"/>
  <text x="72" y="158" fill="#DCECF5" font-family="Source Serif 4, Georgia, serif" font-size="16">Respuesta estructurada</text>
  <text x="72" y="198" fill="#FFFDF7" font-family="Source Serif 4, Georgia, serif" font-size="19">{ &quot;pipeline_abierto&quot;: 100 }</text>
  <path d="M240 236v42" fill="none" stroke="#778984" stroke-width="3" stroke-linecap="round"/>
  <path d="M233 270l7 9 7-9" fill="none" stroke="#778984" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="48" y="297" width="384" height="115" rx="14" fill="#fff" stroke="#23694D" stroke-width="3"/>
  <text x="72" y="335" fill="#23694D" font-family="Source Serif 4, Georgia, serif" font-size="16" font-weight="700">PRIMER FILTRO</text>
  <text x="72" y="371" fill="#172A33" font-family="Fraunces, Georgia, serif" font-size="20" font-weight="700">¿Tiene la forma acordada?</text>
  <text x="72" y="397" fill="#4D6265" font-family="Source Serif 4, Georgia, serif" font-size="16">Sí: el campo y el tipo están presentes.</text>
  <path d="M240 412v42" fill="none" stroke="#778984" stroke-width="3" stroke-linecap="round"/>
  <path d="M233 446l7 9 7-9" fill="none" stroke="#778984" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="48" y="473" width="384" height="115" rx="14" fill="#fff" stroke="#A53636" stroke-width="3"/>
  <text x="72" y="511" fill="#A53636" font-family="Source Serif 4, Georgia, serif" font-size="16" font-weight="700">SEGUNDO FILTRO</text>
  <text x="72" y="547" fill="#172A33" font-family="Fraunces, Georgia, serif" font-size="20" font-weight="700">¿Tiene sentido el valor?</text>
  <text x="72" y="573" fill="#4D6265" font-family="Source Serif 4, Georgia, serif" font-size="16">No: compáralo con la evidencia disponible.</text>
  <text x="240" y="637" text-anchor="middle" fill="#A94E2B" font-family="Fraunces, Georgia, serif" font-size="19" font-weight="700">Formato correcto ≠ resultado correcto</text>
</svg>
