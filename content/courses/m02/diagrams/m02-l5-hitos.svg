<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 566" role="img" aria-labelledby="hitos-t hitos-d">
  <title id="hitos-t">Hitos que se comprueban por separado</title>
  <desc id="hitos-d">El dashboard en tres hitos: leer los datos, calcular los KPI y armar la vista. Entre el hito 1 y el 2, la prueba pasa y apruebas los supuestos. Entre el 2 y el 3, la prueba no pasa y no se avanza: sabes que el problema está en el hito 2 y no en una entrega enorme. Si el hueco está en la especificación, se corrige ahí, no solo en el código.</desc>
  <rect width="480" height="566" rx="18" fill="#FFFDF7"/>
  <text x="24" y="46" font-family="Fraunces, Georgia, serif" font-size="21" font-weight="700" fill="#172A33">Hitos que se comprueban por separado</text>
  <text x="24" y="72" font-family="'Source Serif 4', Georgia, serif" font-size="16" fill="#4D6265">El dashboard, en tres hitos</text>
  <rect x="40" y="96" width="400" height="58" rx="14" fill="#FFFFFF" stroke="#778984" stroke-width="2"/>
  <text x="64" y="132" font-family="Fraunces, Georgia, serif" font-size="18" font-weight="700" fill="#172A33">Hito 1 · leer los datos</text>
  <rect x="40" y="226" width="400" height="58" rx="14" fill="#FFFFFF" stroke="#778984" stroke-width="2"/>
  <text x="64" y="262" font-family="Fraunces, Georgia, serif" font-size="18" font-weight="700" fill="#172A33">Hito 2 · calcular los KPI</text>
  <rect x="40" y="356" width="400" height="58" rx="14" fill="#F5F0E6" stroke="#778984" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="64" y="392" font-family="Fraunces, Georgia, serif" font-size="18" font-weight="700" fill="#4D6265">Hito 3 · armar la vista</text>
  <path d="M90 154V226" stroke="#778984" stroke-width="3"/>
  <circle cx="90" cy="190" r="16" fill="#23694D"/>
  <path d="M82 190l6 6 11-12" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="118" y="186" font-family="'Source Serif 4', Georgia, serif" font-size="16" fill="#172A33">pasa su prueba</text>
  <text x="118" y="208" font-family="'Source Serif 4', Georgia, serif" font-size="16" fill="#4D6265">y apruebas los supuestos</text>
  <path d="M90 284V356" stroke="#778984" stroke-width="3" stroke-dasharray="6 6"/>
  <circle cx="90" cy="320" r="16" fill="#A53636"/>
  <path d="M84 314l12 12M96 314l-12 12" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <text x="118" y="316" font-family="'Source Serif 4', Georgia, serif" font-size="16" font-weight="700" fill="#A53636">no pasa su prueba:</text>
  <text x="118" y="338" font-family="'Source Serif 4', Georgia, serif" font-size="16" fill="#A53636">no se avanza</text>
  <text x="240" y="452" font-family="'Source Serif 4', Georgia, serif" font-size="16" fill="#4D6265" text-anchor="middle">Sabes dónde buscar: en el hito 2,</text>
  <text x="240" y="474" font-family="'Source Serif 4', Georgia, serif" font-size="16" fill="#4D6265" text-anchor="middle">no en una entrega enorme</text>
  <text x="240" y="512" font-family="'Source Serif 4', Georgia, serif" font-size="17" fill="#A94E2B" text-anchor="middle">Si el hueco está en la especificación,</text>
  <text x="240" y="536" font-family="'Source Serif 4', Georgia, serif" font-size="17" fill="#A94E2B" text-anchor="middle">se corrige ahí, no solo en el código</text>
</svg>
