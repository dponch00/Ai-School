<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 880" role="img" aria-labelledby="spec-title spec-desc" font-family="'Source Serif 4', Georgia, serif">
  <title id="spec-title">De una petición ambigua a una especificación verificable</title>
  <desc id="spec-desc">Una petición ambigua se convierte en una especificación con cinco partes: objetivo y decisión; alcance y exclusiones; contexto con archivos e interfaces; supuestos y política de ambigüedad; y está listo cuando, que lleva a una verificación de extremo a extremo.</desc>
  <rect x="0" y="0" width="480" height="880" rx="18" fill="#FFFDF7"/>

  <!-- Petición ambigua -->
  <path d="M70 70c14-34 60-40 84-18 20-30 78-32 102-4 24-24 84-18 96 14 38-2 66 32 50 66 20 24 0 60-36 60H98c-40 0-62-32-44-62-20-22-10-52 16-56z" fill="#F5F0E6" stroke="#778984" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="240" y="100" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-weight="700" font-size="24" fill="#172A33">Petición ambigua</text>
  <text x="240" y="132" text-anchor="middle" font-size="19" fill="#4D6265">«Un dashboard que se vea</text>
  <text x="240" y="156" text-anchor="middle" font-size="19" fill="#4D6265">bien y muestre cómo vamos»</text>

  <path d="M240 206v26" stroke="#172A33" stroke-width="3" stroke-linecap="round"/>
  <path d="M230 224l10 12 10-12" fill="none" stroke="#172A33" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Cinco partes -->
  <g font-size="18" fill="#172A33">
    <rect x="20" y="248" width="440" height="96" rx="14" fill="#FFFFFF" stroke="#778984" stroke-width="2"/>
    <circle cx="60" cy="296" r="20" fill="#A94E2B"/>
    <text x="60" y="303" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-weight="700" font-size="20" fill="#FFFFFF">1</text>
    <text x="94" y="288" font-family="Fraunces, Georgia, serif" font-weight="700" font-size="22">Objetivo y decisión</text>
    <text x="94" y="318" fill="#4D6265">Quién decide qué, periodo y umbral</text>

    <rect x="20" y="356" width="440" height="96" rx="14" fill="#FFFFFF" stroke="#778984" stroke-width="2"/>
    <circle cx="60" cy="404" r="20" fill="#A94E2B"/>
    <text x="60" y="411" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-weight="700" font-size="20" fill="#FFFFFF">2</text>
    <text x="94" y="396" font-family="Fraunces, Georgia, serif" font-weight="700" font-size="22">Alcance y exclusiones</text>
    <text x="94" y="426" fill="#4D6265">Qué entra y qué queda fuera</text>

    <rect x="20" y="464" width="440" height="96" rx="14" fill="#FFFFFF" stroke="#778984" stroke-width="2"/>
    <circle cx="60" cy="512" r="20" fill="#A94E2B"/>
    <text x="60" y="519" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-weight="700" font-size="20" fill="#FFFFFF">3</text>
    <text x="94" y="504" font-family="Fraunces, Georgia, serif" font-weight="700" font-size="22">Archivos e interfaces</text>
    <text x="94" y="534" fill="#4D6265">Dónde trabajar y qué patrón seguir</text>

    <rect x="20" y="572" width="440" height="96" rx="14" fill="#FFFFFF" stroke="#778984" stroke-width="2"/>
    <circle cx="60" cy="620" r="20" fill="#A94E2B"/>
    <text x="60" y="627" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-weight="700" font-size="20" fill="#FFFFFF">4</text>
    <text x="94" y="612" font-family="Fraunces, Georgia, serif" font-weight="700" font-size="22">Supuestos y ambigüedad</text>
    <text x="94" y="642" fill="#4D6265">Qué se pregunta y qué se decide</text>

    <rect x="20" y="680" width="440" height="96" rx="14" fill="#FFFFFF" stroke="#23694D" stroke-width="3"/>
    <circle cx="60" cy="728" r="20" fill="#23694D"/>
    <text x="60" y="735" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-weight="700" font-size="20" fill="#FFFFFF">5</text>
    <text x="94" y="720" font-family="Fraunces, Georgia, serif" font-weight="700" font-size="22">Está listo cuando…</text>
    <text x="94" y="750" fill="#4D6265">Verificación de extremo a extremo</text>
  </g>

  <!-- Verificación -->
  <path d="M240 788v24" stroke="#23694D" stroke-width="3" stroke-linecap="round"/>
  <circle cx="240" cy="840" r="22" fill="#23694D"/>
  <path d="m229 840 8 9 15-18" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
