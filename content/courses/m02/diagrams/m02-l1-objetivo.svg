<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 680" role="img" aria-labelledby="title desc">
  <title id="title">Las cuatro piezas de un objetivo</title>
  <desc id="desc">Un objetivo en el centro se concreta con quién lo usa, para qué sirve, cuándo se necesita y con qué criterio se considerará terminado.</desc>
  <rect width="480" height="680" rx="18" fill="#FFFDF7"/>
  <text x="36" y="52" fill="#172A33" font-family="Fraunces, Georgia, serif" font-size="23" font-weight="700">Las cuatro piezas de un objetivo</text>
  <text x="36" y="81" fill="#4D6265" font-family="Source Serif 4, Georgia, serif" font-size="16">Antes de pedir trabajo, concreta el encargo.</text>
  <rect x="120" y="111" width="240" height="78" rx="14" fill="#DCECF5" stroke="#006E74" stroke-width="3"/>
  <text x="240" y="145" text-anchor="middle" fill="#172A33" font-family="Fraunces, Georgia, serif" font-size="20" font-weight="700">Objetivo</text>
  <text x="240" y="171" text-anchor="middle" fill="#4D6265" font-family="Source Serif 4, Georgia, serif" font-size="16">que se pueda revisar</text>
  <path d="M240 189v30M240 219H132M240 219h108M132 219v22M348 219v22" fill="none" stroke="#778984" stroke-width="3" stroke-linecap="round"/>
  <rect x="36" y="241" width="192" height="126" rx="14" fill="#fff" stroke="#778984" stroke-width="2"/>
  <text x="58" y="276" fill="#A94E2B" font-family="Source Serif 4, Georgia, serif" font-size="16" font-weight="700">QUIÉN</text>
  <text x="58" y="308" fill="#172A33" font-family="Fraunces, Georgia, serif" font-size="18" font-weight="700">La persona que decide</text>
  <text x="58" y="335" fill="#4D6265" font-family="Source Serif 4, Georgia, serif" font-size="16">necesita usar el resultado.</text>
  <rect x="252" y="241" width="192" height="126" rx="14" fill="#fff" stroke="#778984" stroke-width="2"/>
  <text x="274" y="276" fill="#A94E2B" font-family="Source Serif 4, Georgia, serif" font-size="16" font-weight="700">PARA QUÉ</text>
  <text x="274" y="308" fill="#172A33" font-family="Fraunces, Georgia, serif" font-size="18" font-weight="700">La decisión concreta</text>
  <text x="274" y="335" fill="#4D6265" font-family="Source Serif 4, Georgia, serif" font-size="16">que debe permitir tomar.</text>
  <rect x="36" y="397" width="192" height="126" rx="14" fill="#fff" stroke="#778984" stroke-width="2"/>
  <text x="58" y="432" fill="#A94E2B" font-family="Source Serif 4, Georgia, serif" font-size="16" font-weight="700">CUÁNDO</text>
  <text x="58" y="464" fill="#172A33" font-family="Fraunces, Georgia, serif" font-size="18" font-weight="700">El momento o período</text>
  <text x="58" y="491" fill="#4D6265" font-family="Source Serif 4, Georgia, serif" font-size="16">al que se refiere el trabajo.</text>
  <rect x="252" y="397" width="192" height="126" rx="14" fill="#fff" stroke="#778984" stroke-width="2"/>
  <text x="274" y="432" fill="#A94E2B" font-family="Source Serif 4, Georgia, serif" font-size="16" font-weight="700">CON QUÉ CRITERIO</text>
  <text x="274" y="464" fill="#172A33" font-family="Fraunces, Georgia, serif" font-size="18" font-weight="700">La condición de cierre</text>
  <text x="274" y="491" fill="#4D6265" font-family="Source Serif 4, Georgia, serif" font-size="16">que hará visible si terminó.</text>
  <rect x="36" y="563" width="408" height="62" rx="12" fill="#172A33"/>
  <text x="240" y="602" text-anchor="middle" fill="#FFFDF7" font-family="Fraunces, Georgia, serif" font-size="18" font-weight="700">Si falta una pieza, el agente rellena el hueco.</text>
</svg>
