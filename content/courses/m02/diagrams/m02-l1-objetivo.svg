<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 532" role="img" aria-labelledby="objetivo-t objetivo-d">
  <title id="objetivo-t">Las cuatro preguntas de un objetivo</title>
  <desc id="objetivo-d">Cuatro tarjetas con el objetivo del dashboard de Altiplano. Quién lo usa: la directora comercial y la analista de FP&amp;A. Qué decisión apoya: en qué oportunidades concentrar el seguimiento para cerrar el trimestre. Qué periodo cubre: el cuarto trimestre de 2026, con los datos del último snapshot. Qué criterio separa: las oportunidades de más de USD 100 000. Sin tecnología ni gráficas: eso es el cómo.</desc>
  <rect width="480" height="532" rx="18" fill="#FFFDF7"/>
  <text x="24" y="46" font-family="Fraunces, Georgia, serif" font-size="22" font-weight="700" fill="#172A33">Las cuatro preguntas de un objetivo</text>
  <text x="24" y="72" font-family="'Source Serif 4', Georgia, serif" font-size="16" fill="#4D6265">El dashboard de Altiplano</text>
  <rect x="20" y="94" width="440" height="74" rx="14" fill="#FFFFFF" stroke="#778984" stroke-width="2"/>
  <text x="40" y="124" font-family="'Source Serif 4', Georgia, serif" font-size="15" font-weight="700" fill="#A94E2B">QUIÉN LO USA</text>
  <text x="40" y="150" font-family="'Source Serif 4', Georgia, serif" font-size="16" fill="#172A33">La directora comercial y la analista de FP&amp;A</text>
  <rect x="20" y="180" width="440" height="96" rx="14" fill="#FFFFFF" stroke="#778984" stroke-width="2"/>
  <text x="40" y="210" font-family="'Source Serif 4', Georgia, serif" font-size="15" font-weight="700" fill="#A94E2B">QUÉ DECISIÓN APOYA</text>
  <text x="40" y="236" font-family="'Source Serif 4', Georgia, serif" font-size="16" fill="#172A33">En qué oportunidades concentrar el seguimiento</text>
  <text x="40" y="258" font-family="'Source Serif 4', Georgia, serif" font-size="16" fill="#172A33">para cerrar el trimestre</text>
  <rect x="20" y="288" width="440" height="96" rx="14" fill="#FFFFFF" stroke="#778984" stroke-width="2"/>
  <text x="40" y="318" font-family="'Source Serif 4', Georgia, serif" font-size="15" font-weight="700" fill="#A94E2B">QUÉ PERIODO CUBRE</text>
  <text x="40" y="344" font-family="'Source Serif 4', Georgia, serif" font-size="16" fill="#172A33">El cuarto trimestre de 2026, con los datos</text>
  <text x="40" y="366" font-family="'Source Serif 4', Georgia, serif" font-size="16" fill="#172A33">del último snapshot</text>
  <rect x="20" y="396" width="440" height="74" rx="14" fill="#FFFFFF" stroke="#778984" stroke-width="2"/>
  <text x="40" y="426" font-family="'Source Serif 4', Georgia, serif" font-size="15" font-weight="700" fill="#A94E2B">QUÉ CRITERIO SEPARA</text>
  <text x="40" y="452" font-family="'Source Serif 4', Georgia, serif" font-size="16" fill="#172A33">Las oportunidades de más de USD 100 000</text>
  <text x="240" y="508" font-family="'Source Serif 4', Georgia, serif" font-size="17" fill="#A94E2B" text-anchor="middle">Sin tecnología ni gráficas: eso es el cómo</text>
</svg>
