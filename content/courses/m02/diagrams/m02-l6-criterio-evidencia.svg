<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 680" role="img" aria-labelledby="title desc">
  <title id="title">Del criterio a la evidencia</title>
  <desc id="desc">Un criterio específico se convierte en un resultado observable, una comprobación ejecutable y una evidencia que otra persona puede revisar.</desc>
  <rect width="480" height="680" rx="18" fill="#FFFDF7"/>
  <text x="36" y="52" fill="#172A33" font-family="Fraunces, Georgia, serif" font-size="23" font-weight="700">Del criterio a la evidencia</text>
  <text x="36" y="81" fill="#4D6265" font-family="Source Serif 4, Georgia, serif" font-size="16">Convierte «está bien» en algo que se puede comprobar.</text>
  <rect x="58" y="119" width="364" height="92" rx="14" fill="#fff" stroke="#778984" stroke-width="2"/>
  <text x="82" y="153" fill="#A94E2B" font-family="Source Serif 4, Georgia, serif" font-size="16" font-weight="700">1 · CRITERIO ESPECÍFICO</text>
  <text x="82" y="186" fill="#172A33" font-family="Fraunces, Georgia, serif" font-size="19" font-weight="700">Qué debe cumplir el resultado</text>
  <path d="M240 211v32" fill="none" stroke="#778984" stroke-width="3" stroke-linecap="round"/>
  <path d="M233 235l7 9 7-9" fill="none" stroke="#778984" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="58" y="262" width="364" height="92" rx="14" fill="#fff" stroke="#778984" stroke-width="2"/>
  <text x="82" y="296" fill="#A94E2B" font-family="Source Serif 4, Georgia, serif" font-size="16" font-weight="700">2 · RESULTADO OBSERVABLE</text>
  <text x="82" y="329" fill="#172A33" font-family="Fraunces, Georgia, serif" font-size="19" font-weight="700">Qué se verá si se cumple</text>
  <path d="M240 354v32" fill="none" stroke="#778984" stroke-width="3" stroke-linecap="round"/>
  <path d="M233 378l7 9 7-9" fill="none" stroke="#778984" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="58" y="405" width="364" height="92" rx="14" fill="#DCECF5" stroke="#006E74" stroke-width="3"/>
  <text x="82" y="439" fill="#006E74" font-family="Source Serif 4, Georgia, serif" font-size="16" font-weight="700">3 · COMPROBACIÓN EJECUTABLE</text>
  <text x="82" y="472" fill="#172A33" font-family="Fraunces, Georgia, serif" font-size="19" font-weight="700">Cómo se verificará sin adivinar</text>
  <path d="M240 497v32" fill="none" stroke="#778984" stroke-width="3" stroke-linecap="round"/>
  <path d="M233 521l7 9 7-9" fill="none" stroke="#778984" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="58" y="548" width="364" height="74" rx="14" fill="#172A33"/>
  <text x="82" y="581" fill="#DCECF5" font-family="Source Serif 4, Georgia, serif" font-size="16" font-weight="700">4 · EVIDENCIA</text>
  <text x="82" y="608" fill="#FFFDF7" font-family="Fraunces, Georgia, serif" font-size="18" font-weight="700">Una salida que otra persona puede revisar</text>
  <text x="240" y="658" text-anchor="middle" fill="#A94E2B" font-family="Source Serif 4, Georgia, serif" font-size="18" font-weight="700">Evidencia, no afirmaciones.</text>
</svg>
