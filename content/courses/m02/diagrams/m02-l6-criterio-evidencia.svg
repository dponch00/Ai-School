<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 616" role="img" aria-labelledby="criterio-t criterio-d">
  <title id="criterio-t">Del criterio a la evidencia</title>
  <desc id="criterio-d">Cuatro pasos con un caso del dashboard de Altiplano. Criterio específico: una oportunidad sin fecha de cierre no suma al pipeline del trimestre. Resultado observable: aparece en el panel de calidad de datos, no «se guardó en la base». Comprobación ejecutable: una prueba o el script de reconciliación que el propio agente puede correr. Evidencia: el comando, su salida y el valor esperado frente al obtenido, en el reporte final.</desc>
  <rect width="480" height="616" rx="18" fill="#FFFDF7"/>
  <text x="24" y="46" font-family="Fraunces, Georgia, serif" font-size="23" font-weight="700" fill="#172A33">Del criterio a la evidencia</text>
  <text x="24" y="72" font-family="'Source Serif 4', Georgia, serif" font-size="16" fill="#4D6265">Un caso del dashboard de Altiplano</text>
  <rect x="20" y="94" width="440" height="96" rx="14" fill="#FFFFFF" stroke="#778984" stroke-width="2"/>
  <text x="40" y="122" font-family="'Source Serif 4', Georgia, serif" font-size="15" font-weight="700" fill="#A94E2B">1 · CRITERIO ESPECÍFICO</text>
  <text x="40" y="150" font-family="'Source Serif 4', Georgia, serif" font-size="16" fill="#172A33">Una oportunidad sin fecha de cierre</text>
  <text x="40" y="174" font-family="'Source Serif 4', Georgia, serif" font-size="16" fill="#172A33">no suma al pipeline del trimestre</text>
  <path d="M240 190V210" stroke="#172A33" stroke-width="3" stroke-linecap="round"/><path d="M231 202l9 10 9-10" fill="none" stroke="#172A33" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="20" y="214" width="440" height="96" rx="14" fill="#FFFFFF" stroke="#778984" stroke-width="2"/>
  <text x="40" y="242" font-family="'Source Serif 4', Georgia, serif" font-size="15" font-weight="700" fill="#A94E2B">2 · RESULTADO OBSERVABLE</text>
  <text x="40" y="270" font-family="'Source Serif 4', Georgia, serif" font-size="16" fill="#172A33">Aparece en el panel de calidad de datos,</text>
  <text x="40" y="294" font-family="'Source Serif 4', Georgia, serif" font-size="16" fill="#172A33">no «se guardó en la base»</text>
  <path d="M240 310V330" stroke="#172A33" stroke-width="3" stroke-linecap="round"/><path d="M231 322l9 10 9-10" fill="none" stroke="#172A33" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="20" y="334" width="440" height="96" rx="14" fill="#DCECF5" stroke="#006E74" stroke-width="2"/>
  <text x="40" y="362" font-family="'Source Serif 4', Georgia, serif" font-size="15" font-weight="700" fill="#A94E2B">3 · COMPROBACIÓN EJECUTABLE</text>
  <text x="40" y="390" font-family="'Source Serif 4', Georgia, serif" font-size="16" fill="#172A33">Una prueba o el script de reconciliación</text>
  <text x="40" y="414" font-family="'Source Serif 4', Georgia, serif" font-size="16" fill="#172A33">que el propio agente puede correr</text>
  <path d="M240 430V450" stroke="#172A33" stroke-width="3" stroke-linecap="round"/><path d="M231 442l9 10 9-10" fill="none" stroke="#172A33" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="20" y="454" width="440" height="96" rx="14" fill="#F5F0E6" stroke="#172A33" stroke-width="2"/>
  <text x="40" y="482" font-family="'Source Serif 4', Georgia, serif" font-size="15" font-weight="700" fill="#A94E2B">4 · EVIDENCIA</text>
  <text x="40" y="510" font-family="'Source Serif 4', Georgia, serif" font-size="16" fill="#172A33">El comando, su salida y el valor esperado</text>
  <text x="40" y="534" font-family="'Source Serif 4', Georgia, serif" font-size="16" fill="#172A33">frente al obtenido, en el reporte final</text>
  <text x="240" y="588" font-family="'Source Serif 4', Georgia, serif" font-size="17" fill="#A94E2B" text-anchor="middle">Evidencia, no afirmaciones</text>
</svg>
