<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 562" role="img" aria-labelledby="reglas-t reglas-d">
  <title id="reglas-t">Dónde va cada regla</title>
  <desc id="reglas-d">Dos cajas apiladas, cada una con su propia flecha hacia el agente. Proyecto: el archivo de instrucciones, que vale para todas las tareas, por ejemplo «los cálculos van en Python». Tarea: el prompt, que vale solo para este encargo, por ejemplo «toca solo kpis.py». Las dos llegan al agente, cada una por su lado. Repetir reglas en cada prompt gasta contexto.</desc>
  <rect width="480" height="562" rx="18" fill="#FFFDF7"/>
  <text x="24" y="46" font-family="Fraunces, Georgia, serif" font-size="23" font-weight="700" fill="#172A33">Dónde va cada regla</text>
  <text x="24" y="72" font-family="'Source Serif 4', Georgia, serif" font-size="16" fill="#4D6265">Lo estable, en un archivo; lo de hoy, en el prompt</text>
  <rect x="20" y="96" width="360" height="120" rx="14" fill="#FFFFFF" stroke="#778984" stroke-width="2"/>
  <text x="40" y="126" font-family="'Source Serif 4', Georgia, serif" font-size="15" font-weight="700" fill="#A94E2B">PROYECTO</text>
  <text x="40" y="154" font-family="Fraunces, Georgia, serif" font-size="19" font-weight="700" fill="#172A33">Archivo de instrucciones</text>
  <text x="40" y="180" font-family="'Source Serif 4', Georgia, serif" font-size="16" fill="#4D6265">Vale para todas las tareas</text>
  <text x="40" y="202" font-family="'Source Serif 4', Georgia, serif" font-size="16" fill="#172A33">«Los cálculos van en Python»</text>
  <rect x="20" y="236" width="360" height="120" rx="14" fill="#FFFFFF" stroke="#778984" stroke-width="2"/>
  <text x="40" y="266" font-family="'Source Serif 4', Georgia, serif" font-size="15" font-weight="700" fill="#A94E2B">TAREA</text>
  <text x="40" y="294" font-family="Fraunces, Georgia, serif" font-size="19" font-weight="700" fill="#172A33">Prompt</text>
  <text x="40" y="320" font-family="'Source Serif 4', Georgia, serif" font-size="16" fill="#4D6265">Vale solo para este encargo</text>
  <text x="40" y="342" font-family="'Source Serif 4', Georgia, serif" font-size="16" fill="#172A33">«Toca solo kpis.py»</text>
  <path d="M380 156H430V430H352" fill="none" stroke="#172A33" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M364 421l-10 9 10 9" fill="none" stroke="#172A33" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M200 356V394" stroke="#172A33" stroke-width="3" stroke-linecap="round"/><path d="M191 386l9 10 9-10" fill="none" stroke="#172A33" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="100" y="398" width="250" height="64" rx="14" fill="#DCECF5" stroke="#006E74" stroke-width="3"/>
  <text x="225" y="437" font-family="Fraunces, Georgia, serif" font-size="20" font-weight="700" fill="#172A33" text-anchor="middle">Agente</text>
  <text x="240" y="500" font-family="'Source Serif 4', Georgia, serif" font-size="16" fill="#4D6265" text-anchor="middle">Las dos llegan al agente, cada una por su lado</text>
  <text x="240" y="532" font-family="'Source Serif 4', Georgia, serif" font-size="17" fill="#A94E2B" text-anchor="middle">Repetir reglas en cada prompt gasta contexto</text>
</svg>
