<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 735" role="img" aria-labelledby="t d" font-family="Source Serif 4, Georgia, serif">
  <title id="t">Cuatro piezas de una delegación</title>
  <desc id="d">El encargo del redactor de Altiplano define un objetivo y archivo, las herramientas permitidas, el estado escrito y una condición de término comprobable: el criterio se cumple o se detiene tras dos rondas y marca el borrador sin aprobar.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#172A33" stroke-width="2"/></marker></defs>
  <rect width="480" height="735" rx="18" fill="#FFFDF7"/>
  <text x="28" y="46" font-family="Fraunces, Georgia, serif" font-size="23" font-weight="700" fill="#172A33">Delegar sin dejar huecos</text>
  <text x="28" y="73" font-size="16" fill="#4D6265">Caso: encargo del redactor del comité.</text>
  <g fill="#fff" stroke="#778984" stroke-width="2"><rect x="42" y="106" width="396" height="106" rx="13"/><rect x="42" y="237" width="396" height="106" rx="13"/><rect x="42" y="368" width="396" height="106" rx="13"/><rect x="42" y="499" width="396" height="126" rx="13"/></g>
  <g fill="#172A33"><text x="64" y="139" font-family="Fraunces, Georgia, serif" font-size="19" font-weight="700">Objetivo</text><text x="64" y="166" font-size="15">Comentario del 26 de octubre,</text><text x="64" y="188" font-size="15">en drafts/comentario-2026-10-26.md</text><text x="64" y="270" font-family="Fraunces, Georgia, serif" font-size="19" font-weight="700">Herramientas</text><text x="64" y="297" font-size="15">Lee contrato verificado; escribe</text><text x="64" y="319" font-size="15">solo en drafts/</text><text x="64" y="401" font-family="Fraunces, Georgia, serif" font-size="19" font-weight="700">Estado</text><text x="64" y="428" font-size="15">Borrador y criterios que fallaron,</text><text x="64" y="450" font-size="15">para que otro lo revise</text><text x="64" y="532" font-family="Fraunces, Georgia, serif" font-size="19" font-weight="700">Condición de término</text><text x="64" y="559" font-size="15">Criterio comprobable, o dos rondas;</text><text x="64" y="581" font-size="15">si no cumple, marcado «sin aprobar»</text></g>
  <path d="M240 212v25" stroke="#172A33" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M240 343v25" stroke="#172A33" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M240 474v25" stroke="#172A33" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <text x="240" y="682" text-anchor="middle" font-size="16" fill="#4D6265">Un tope limita el daño; no prueba el resultado.</text>
  <text x="240" y="715" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="700" fill="#A94E2B">Lo que no está escrito no existe para el subagente.</text>
</svg>
