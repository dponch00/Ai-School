<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 885" role="img" aria-labelledby="t d" font-family="Source Serif 4, Georgia, serif">
  <title id="t">Cuatro preguntas para decidir dónde corre el trabajo</title>
  <desc id="d">Antes de programar el borrador de Altiplano, se pregunta por archivos locales, computadora encendida, sesión abierta y aprobaciones. Según las respuestas, se elige nube, equipo, sesión, integración continua o no correr solo.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#172A33" stroke-width="2"/></marker></defs>
  <rect width="480" height="885" rx="18" fill="#FFFDF7"/>
  <text x="28" y="46" font-family="Fraunces, Georgia, serif" font-size="23" font-weight="700" fill="#172A33">Antes de programar, pregunta</text>
  <text x="28" y="73" font-size="16" fill="#4D6265">Caso: el borrador de las ocho.</text>
  <g fill="#fff" stroke="#778984" stroke-width="2"><rect x="42" y="107" width="396" height="55" rx="13"/><rect x="42" y="178" width="396" height="55" rx="13"/><rect x="42" y="249" width="396" height="55" rx="13"/><rect x="42" y="320" width="396" height="55" rx="13"/></g>
  <g font-size="16" fill="#172A33"><text x="62" y="141">¿Necesita archivos solo de tu equipo?</text><text x="62" y="212">¿Puede depender de tu computadora encendida?</text><text x="62" y="283">¿Puede depender de una sesión abierta?</text><text x="62" y="354">¿Quién aprueba lo que pediría permiso?</text></g>
  <path d="M240 375v31" stroke="#172A33" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <text x="240" y="438" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="20" font-weight="700" fill="#172A33">Escoge la vía</text>
  <g fill="#fff" stroke="#778984" stroke-width="2"><rect x="42" y="465" width="396" height="64" rx="13"/><rect x="42" y="544" width="396" height="64" rx="13"/><rect x="42" y="623" width="396" height="64" rx="13"/><rect x="42" y="702" width="396" height="64" rx="13"/><rect x="42" y="781" width="396" height="64" rx="13"/></g>
  <g fill="#172A33"><text x="63" y="492" font-family="Fraunces, Georgia, serif" font-size="18" font-weight="700">Nube</text><text x="63" y="515" font-size="15">Solo repositorio; termina en borrador o PR</text><text x="63" y="571" font-family="Fraunces, Georgia, serif" font-size="18" font-weight="700">Equipo</text><text x="63" y="594" font-size="15">Archivos locales; máquina encendida; worktree</text><text x="63" y="650" font-family="Fraunces, Georgia, serif" font-size="18" font-weight="700">Sesión</text><text x="63" y="673" font-size="15">Vigilar algo mientras trabajas</text><text x="63" y="729" font-family="Fraunces, Georgia, serif" font-size="18" font-weight="700">Integración continua</text><text x="63" y="752" font-size="15">Trabajo fijo, sin decisiones</text><text x="63" y="808" font-family="Fraunces, Georgia, serif" font-size="18" font-weight="700">Nada que corra solo</text><text x="63" y="831" font-size="15">Depende de decisiones que hay que conversar</text></g>
  <text x="240" y="874" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="700" fill="#A94E2B">Lo que corre solo deja algo para revisar.</text>
</svg>
