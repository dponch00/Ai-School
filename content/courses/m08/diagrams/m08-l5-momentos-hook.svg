<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 790" role="img" aria-labelledby="t d" font-family="Source Serif 4, Georgia, serif">
  <title id="t">Tres momentos para un hook</title>
  <desc id="d">En el repositorio de Altiplano, un hook antes de editar bloquea expected y los supuestos. Un hook después ejecuta reconcile.py, y un hook al terminar no deja cerrar mientras la reconciliación falle, con un tope.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#172A33" stroke-width="2"/></marker></defs>
  <rect width="480" height="790" rx="18" fill="#FFFDF7"/>
  <text x="28" y="46" font-family="Fraunces, Georgia, serif" font-size="23" font-weight="700" fill="#172A33">Un hook actúa en un momento fijo</text>
  <text x="28" y="73" font-size="16" fill="#4D6265">Caso: tres reglas del repositorio de Altiplano.</text>
  <rect x="42" y="108" width="396" height="74" rx="13" fill="#fff" stroke="#778984" stroke-width="2"/>
  <text x="63" y="137" font-family="Fraunces, Georgia, serif" font-size="18" font-weight="700" fill="#172A33">Antes de la herramienta</text><text x="63" y="161" font-size="15" fill="#172A33">Bloquea editar expected/ y supuestos.</text>
  <path d="M240 182v29" stroke="#172A33" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <rect x="42" y="226" width="396" height="68" rx="13" fill="#DCECF5" stroke="#778984" stroke-width="2"/>
  <text x="240" y="255" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="18" font-weight="700" fill="#172A33">Herramienta edita el cálculo</text><text x="240" y="278" text-anchor="middle" font-size="15" fill="#4D6265">La acción ya ocurrió al salir.</text>
  <path d="M240 294v29" stroke="#172A33" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <rect x="42" y="338" width="396" height="74" rx="13" fill="#fff" stroke="#778984" stroke-width="2"/>
  <text x="63" y="367" font-family="Fraunces, Georgia, serif" font-size="18" font-weight="700" fill="#172A33">Después de la herramienta</text><text x="63" y="391" font-size="15" fill="#172A33">Ejecuta reconcile.py; no deshace.</text>
  <path d="M240 412v29" stroke="#172A33" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <rect x="42" y="456" width="396" height="68" rx="13" fill="#F5F0E6" stroke="#778984" stroke-width="2"/>
  <text x="240" y="485" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="18" font-weight="700" fill="#172A33">Agente intenta terminar</text><text x="240" y="508" text-anchor="middle" font-size="15" fill="#4D6265">¿La reconciliación terminó con código 0?</text>
  <path d="M240 524v29" stroke="#172A33" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <rect x="42" y="568" width="396" height="91" rx="13" fill="#fff" stroke="#778984" stroke-width="2"/>
  <text x="63" y="597" font-family="Fraunces, Georgia, serif" font-size="18" font-weight="700" fill="#172A33">Al terminar: compuerta</text><text x="63" y="621" font-size="15" fill="#172A33">Si falla, devuelve el motivo al agente.</text><text x="63" y="644" font-size="15" fill="#4D6265">Con tope para no encerrarlo en un ciclo.</text>
  <path d="M240 659v29" stroke="#4D6265" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <rect x="42" y="703" width="396" height="42" rx="13" fill="#23694D"/>
  <text x="240" y="731" text-anchor="middle" font-size="16" fill="#fff">Código 0: puede terminar</text>
  <text x="240" y="780" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="700" fill="#A94E2B">Un hook no vigila todas las vías.</text>
</svg>
