<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 755" role="img" aria-labelledby="t d" font-family="Source Serif 4, Georgia, serif">
  <title id="t">Flujo fijo frente a agente</title>
  <desc id="d">Para convertir euros cada viernes, el código decide pasos fijos: calcula, reconcilia, redacta y una persona revisa. Para investigar por qué falló la reconciliación del Norte, un agente decide el siguiente paso según lo que encuentra.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#172A33" stroke-width="2"/></marker></defs>
  <rect width="480" height="755" rx="18" fill="#FFFDF7"/>
  <text x="28" y="46" font-family="Fraunces, Georgia, serif" font-size="23" font-weight="700" fill="#172A33">Quién decide el siguiente paso</text>
  <text x="28" y="73" font-size="16" fill="#4D6265">Dos pedidos distintos de Altiplano.</text>
  <rect x="42" y="106" width="396" height="48" rx="13" fill="#006E74"/><text x="240" y="137" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="19" font-weight="700" fill="#fff">Flujo fijo: convertir euros</text>
  <g fill="#fff" stroke="#778984" stroke-width="2"><rect x="42" y="180" width="396" height="50" rx="13"/><rect x="42" y="255" width="396" height="50" rx="13"/><rect x="42" y="330" width="396" height="50" rx="13"/><rect x="42" y="405" width="396" height="50" rx="13"/></g>
  <g font-size="16" fill="#172A33"><text x="240" y="212" text-anchor="middle">Script calcula</text><text x="240" y="287" text-anchor="middle">Reconciliación verifica</text><text x="240" y="362" text-anchor="middle">Modelo redacta</text><text x="240" y="437" text-anchor="middle">Persona revisa</text></g>
  <path d="M240 230v25" stroke="#172A33" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M240 305v25" stroke="#172A33" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M240 380v25" stroke="#172A33" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <text x="240" y="481" text-anchor="middle" font-size="15" fill="#4D6265">El código fija el camino.</text>
  <rect x="42" y="511" width="396" height="48" rx="13" fill="#DCECF5" stroke="#778984" stroke-width="2"/><text x="240" y="542" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="19" font-weight="700" fill="#172A33">Agente: falla del Norte</text>
  <path d="M240 559v27" stroke="#172A33" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <rect x="42" y="601" width="396" height="76" rx="13" fill="#fff" stroke="#778984" stroke-width="2"/>
  <text x="240" y="630" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="18" font-weight="700" fill="#172A33">Modelo decide qué mirar</text><text x="240" y="654" text-anchor="middle" font-size="15" fill="#4D6265">Lee datos, script y resultado; ajusta el paso.</text>
  <path d="M240 677v22" stroke="#4D6265" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <text x="240" y="736" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="700" fill="#A94E2B">Agente: para lo que no se puede prever.</text>
</svg>
