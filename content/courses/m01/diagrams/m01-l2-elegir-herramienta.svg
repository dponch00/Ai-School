<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 780" role="img" aria-labelledby="t d" font-family="'Source Serif 4', Georgia, serif"><title id="t">Cuatro preguntas para elegir herramienta</title><desc id="d">Un árbol vertical pregunta qué debe tocar la tarea, si necesita información reciente, si el resultado se ejecuta y cómo se comprobará. Sus resultados son conversar, investigar, datos con código o agente de código.</desc><rect width="480" height="780" rx="18" fill="#FFFDF7"/><text x="28" y="48" font-family="Fraunces, Georgia, serif" font-size="24" font-weight="700" fill="#172A33">Antes de elegir</text><text x="28" y="76" font-size="17" fill="#4D6265">Cuatro preguntas ordenan la tarea</text><g fill="#FFF" stroke="#778984" stroke-width="2"><rect x="58" y="108" width="364" height="68" rx="14"/><rect x="58" y="214" width="364" height="68" rx="14"/><rect x="58" y="320" width="364" height="68" rx="14"/><rect x="58" y="426" width="364" height="68" rx="14"/></g><g font-size="18" fill="#172A33" text-anchor="middle"><text x="240" y="148">¿Qué tiene que tocar?</text><text x="240" y="254">¿Necesita información reciente?</text><text x="240" y="360">¿El resultado se va a ejecutar?</text><text x="240" y="466">¿Cómo vas a comprobarlo?</text></g><g stroke="#172A33" stroke-width="3" fill="none"><path d="M240 176v28m0 78v28m0 78v28m0 78v28"/><path d="M232 196l8 10 8-10m-16 106 8 10 8-10m-16 106 8 10 8-10m-16 106 8 10 8-10"/></g><g fill="#DCECF5" stroke="#778984" stroke-width="2"><rect x="28" y="550" width="98" height="78" rx="12"/><rect x="137" y="550" width="98" height="78" rx="12"/><rect x="246" y="550" width="98" height="78" rx="12"/><rect x="355" y="550" width="98" height="78" rx="12"/></g><g text-anchor="middle" fill="#172A33" font-size="16"><text x="77" y="581" font-family="Fraunces, Georgia, serif" font-weight="700">Conversar</text><text x="77" y="607">explicar</text><text x="186" y="581" font-family="Fraunces, Georgia, serif" font-weight="700">Investigar</text><text x="186" y="607">fuentes</text><text x="295" y="581" font-family="Fraunces, Georgia, serif" font-weight="700">Datos</text><text x="295" y="607">con código</text><text x="404" y="581" font-family="Fraunces, Georgia, serif" font-weight="700">Agente</text><text x="404" y="607">y pruebas</text></g><text x="240" y="688" text-anchor="middle" font-size="18" fill="#A94E2B">La herramienta sigue la tarea, no la costumbre</text></svg>
