<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 720" role="img" aria-labelledby="t d" font-family="'Source Serif 4', Georgia, serif"><title id="t">Cinco capas que cambian lo que puede hacer una herramienta</title><desc id="d">Cinco capas anidadas, de modelo a entorno de ejecución. El modelo produce texto; el agente añade herramientas y bucle; el producto y la superficie cambian capacidades; el entorno decide archivos, permisos y red.</desc><rect width="480" height="720" rx="18" fill="#FFFDF7"/><text x="28" y="48" font-family="Fraunces, Georgia, serif" font-size="24" font-weight="700" fill="#172A33">La misma IA, cinco capas</text><text x="28" y="76" font-size="17" fill="#4D6265">Cada capa aporta algo distinto</text><g fill="#FFF" stroke="#778984" stroke-width="2"><rect x="28" y="106" width="424" height="546" rx="16" fill="#F5F0E6"/><rect x="48" y="158" width="384" height="420" rx="16" fill="#DCECF5"/><rect x="68" y="210" width="344" height="294" rx="16"/><rect x="88" y="262" width="304" height="168" rx="16"/></g><g font-size="17" fill="#172A33"><text x="52" y="140" font-family="Fraunces, Georgia, serif" font-size="21" font-weight="700">Entorno de ejecución</text><text x="52" y="604">archivos · permisos · red</text><text x="72" y="192" font-family="Fraunces, Georgia, serif" font-size="21" font-weight="700">Superficie</text><text x="72" y="630">navegador · terminal · nube</text><text x="92" y="244" font-family="Fraunces, Georgia, serif" font-size="21" font-weight="700">Producto</text><text x="92" y="478">herramientas · datos guardados</text><text x="112" y="296" font-family="Fraunces, Georgia, serif" font-size="21" font-weight="700">Agente</text><text x="112" y="322">herramientas + bucle</text></g><circle cx="240" cy="376" r="48" fill="#006E74"/><text x="240" y="371" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="20" font-weight="700" fill="#FFF">Modelo</text><text x="240" y="397" text-anchor="middle" font-size="16" fill="#FFF">produce texto</text><text x="240" y="688" text-anchor="middle" font-size="18" fill="#A94E2B">Antes de culpar al modelo, revisa las capas</text></svg>
