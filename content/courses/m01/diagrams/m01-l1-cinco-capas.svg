<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 590" role="img" aria-labelledby="cinco-capas-t cinco-capas-d">
  <title id="cinco-capas-t">La misma IA, cinco capas</title>
  <desc id="cinco-capas-d">Cinco capas anidadas. En el centro, el modelo, que produce el texto. Lo rodea el agente, que suma herramientas y un bucle. Lo envuelve el producto, que decide las herramientas y qué se guarda. Después, la superficie: chat web, app, terminal o editor. Por fuera, el entorno de ejecución: tu equipo, una máquina del proveedor o un contenedor. Antes de culpar al modelo, revisa las capas.</desc>
  <rect width="480" height="590" rx="18" fill="#FFFDF7"/>
  <text x="24" y="46" font-family="Fraunces, Georgia, serif" font-size="23" font-weight="700" fill="#172A33">La misma IA, cinco capas</text>
  <text x="24" y="72" font-family="'Source Serif 4', Georgia, serif" font-size="16" fill="#4D6265">Cada capa aporta algo distinto</text>
  <rect x="20" y="92" width="440" height="432" rx="14" fill="#F5F0E6" stroke="#778984" stroke-width="2"/>
  <text x="40" y="122" font-family="Fraunces, Georgia, serif" font-size="19" font-weight="700" fill="#172A33">Entorno de ejecución</text>
  <rect x="36" y="136" width="408" height="330" rx="14" fill="#DCECF5" stroke="#778984" stroke-width="2"/>
  <text x="56" y="164" font-family="Fraunces, Georgia, serif" font-size="19" font-weight="700" fill="#172A33">Superficie</text>
  <rect x="52" y="178" width="376" height="246" rx="14" fill="#FFFFFF" stroke="#778984" stroke-width="2"/>
  <text x="72" y="206" font-family="Fraunces, Georgia, serif" font-size="19" font-weight="700" fill="#172A33">Producto</text>
  <rect x="68" y="220" width="344" height="166" rx="14" fill="#FFFFFF" stroke="#778984" stroke-width="2"/>
  <text x="88" y="248" font-family="Fraunces, Georgia, serif" font-size="19" font-weight="700" fill="#172A33">Agente</text>
  <text x="88" y="272" font-family="'Source Serif 4', Georgia, serif" font-size="16" fill="#4D6265">herramientas + bucle</text>
  <circle cx="330" cy="320" r="48" fill="#006E74"/>
  <text x="330" y="326" font-family="Fraunces, Georgia, serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">Modelo</text>
  <text x="88" y="330" font-family="'Source Serif 4', Georgia, serif" font-size="16" fill="#4D6265">produce el texto</text>
  <text x="88" y="352" font-family="'Source Serif 4', Georgia, serif" font-size="16" fill="#4D6265">dentro del bucle</text>
  <text x="72" y="410" font-family="'Source Serif 4', Georgia, serif" font-size="16" fill="#4D6265">herramientas · qué se guarda</text>
  <text x="56" y="452" font-family="'Source Serif 4', Georgia, serif" font-size="16" fill="#4D6265">chat web · app · terminal · editor</text>
  <text x="40" y="498" font-family="'Source Serif 4', Georgia, serif" font-size="16" fill="#4D6265">tu equipo · máquina del proveedor · contenedor</text>
  <text x="240" y="560" font-family="'Source Serif 4', Georgia, serif" font-size="17" fill="#A94E2B" text-anchor="middle">Antes de culpar al modelo, revisa las capas</text>
</svg>
