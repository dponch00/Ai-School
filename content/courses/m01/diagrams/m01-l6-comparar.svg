<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 700" role="img" aria-labelledby="t d" font-family="'Source Serif 4', Georgia, serif"><title id="t">Comparar herramientas con tarea fija y criterio crítico</title><desc id="d">La misma tarea pasa a dos herramientas durante varios ensayos. Un criterio crítico de cifras exactas descalifica a una herramienta aunque su puntaje promedio sea alto.</desc><rect width="480" height="700" rx="18" fill="#FFFDF7"/><text x="28" y="48" font-family="Fraunces, Georgia, serif" font-size="24" font-weight="700" fill="#172A33">Comparar no es probar una vez</text><rect x="54" y="88" width="372" height="68" rx="14" fill="#DCECF5" stroke="#778984" stroke-width="2"/><text x="240" y="130" text-anchor="middle" font-size="20" fill="#172A33">Misma tarea · mismas entradas · rúbrica</text><path d="M240 156v48m-8-8 8 10 8-10" stroke="#172A33" stroke-width="3" fill="none"/><g fill="#FFF" stroke="#778984" stroke-width="2"><rect x="48" y="220" width="168" height="216" rx="14"/><rect x="264" y="220" width="168" height="216" rx="14"/></g><g font-family="Fraunces, Georgia, serif" font-size="20" font-weight="700" fill="#172A33" text-anchor="middle"><text x="132" y="256">Herramienta A</text><text x="348" y="256">Herramienta B</text></g><g fill="#23694D" font-size="17" text-anchor="middle"><text x="132" y="302">Ensayo 1 ✓</text><text x="132" y="334">Ensayo 2 ✓</text><text x="132" y="366">Ensayo 3 ✓</text></g><g fill="#172A33" font-size="17" text-anchor="middle"><text x="348" y="302">Ensayo 1 ✓</text><text x="348" y="334">Ensayo 2 ✕</text><text x="348" y="366">Ensayo 3 ✓</text></g><rect x="64" y="476" width="352" height="78" rx="14" fill="#FFF" stroke="#A53636" stroke-width="3"/><text x="240" y="510" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="19" font-weight="700" fill="#A53636">Criterio crítico: cifras exactas</text><text x="240" y="536" text-anchor="middle" font-size="16" fill="#172A33">Si falla una vez, el promedio no compensa</text><text x="240" y="620" text-anchor="middle" font-size="18" fill="#A94E2B">Anota también modelo, superficie y fecha</text></svg>
