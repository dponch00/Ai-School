<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 800" role="img" aria-labelledby="api-title api-desc" font-family="'Source Serif 4', Georgia, serif">
  <title id="api-title">Dos vías para usar el mismo modelo: el chat y la API</title>
  <desc id="api-desc">Arriba, en el chat, una persona escribe y lee cada respuesta: una nota a la vez. Abajo, con la API, un script con la clave de API toma las 1 200 notas, envía una solicitud por nota al modelo, recibe cada respuesta y anota los cuatro campos en una planilla, sin que nadie intervenga.</desc>
  <rect x="0" y="0" width="480" height="800" rx="18" fill="#FFFDF7"/>

  <!-- Vía 1: chat -->
  <text x="28" y="50" font-family="Fraunces, Georgia, serif" font-weight="700" font-size="24" fill="#172A33">En el chat</text>
  <text x="28" y="78" font-size="18" fill="#4D6265">Una persona pega cada nota y lee la respuesta</text>

  <g>
    <circle cx="70" cy="146" r="18" fill="#172A33"/>
    <path d="M38 200c0-22 14-34 32-34s32 12 32 34z" fill="#172A33"/>
    <text x="70" y="228" text-anchor="middle" font-size="17" fill="#172A33">Persona</text>

    <rect x="150" y="116" width="150" height="104" rx="14" fill="#FFFFFF" stroke="#778984" stroke-width="2"/>
    <rect x="166" y="134" width="88" height="20" rx="10" fill="#DCECF5"/>
    <rect x="196" y="162" width="88" height="20" rx="10" fill="#F5F0E6" stroke="#778984"/>
    <rect x="166" y="190" width="70" height="16" rx="8" fill="#DCECF5"/>
    <text x="225" y="244" text-anchor="middle" font-size="17" fill="#172A33">Ventana de chat</text>

    <circle cx="404" cy="168" r="48" fill="#006E74"/>
    <text x="404" y="174" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-weight="700" font-size="17" fill="#FFFFFF">Modelo</text>

    <path d="M108 160h32M310 160h40" stroke="#172A33" stroke-width="3" stroke-linecap="round"/>
    <path d="M132 152l10 8-10 8M342 152l10 8-10 8" fill="none" stroke="#172A33" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M140 184h-32M350 184h-40" stroke="#4D6265" stroke-width="3" stroke-linecap="round"/>
    <path d="M116 176l-10 8 10 8M318 176l-10 8 10 8" fill="none" stroke="#4D6265" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="240" y="290" text-anchor="middle" font-size="18" fill="#A94E2B">1 200 notas = 1 200 veces pegar y copiar</text>

  <path d="M28 326h424" stroke="#778984" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Vía 2: API -->
  <text x="28" y="374" font-family="Fraunces, Georgia, serif" font-weight="700" font-size="24" fill="#172A33">Con la API</text>
  <text x="28" y="402" font-size="18" fill="#4D6265">Un programa hace el trabajo repetido</text>

  <g>
    <!-- Notas -->
    <rect x="40" y="440" width="96" height="64" rx="8" fill="#F5F0E6" stroke="#778984" stroke-width="2"/>
    <rect x="32" y="448" width="96" height="64" rx="8" fill="#F5F0E6" stroke="#778984" stroke-width="2"/>
    <rect x="24" y="456" width="96" height="64" rx="8" fill="#FFFFFF" stroke="#778984" stroke-width="2"/>
    <text x="72" y="486" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-weight="700" font-size="18" fill="#172A33">1 200</text>
    <text x="72" y="508" text-anchor="middle" font-size="16" fill="#4D6265">notas</text>

    <!-- Script con clave -->
    <rect x="150" y="436" width="120" height="96" rx="14" fill="#FFFFFF" stroke="#172A33" stroke-width="2"/>
    <text x="210" y="476" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-weight="700" font-size="20" fill="#172A33">Script</text>
    <circle cx="184" cy="504" r="8" fill="none" stroke="#A94E2B" stroke-width="3"/>
    <path d="M192 504h40M222 504v8M230 504v6" stroke="#A94E2B" stroke-width="3" stroke-linecap="round"/>
    <text x="210" y="556" text-anchor="middle" font-size="16" fill="#A94E2B">con la clave de API</text>

    <path d="M128 484h12" stroke="#172A33" stroke-width="3" stroke-linecap="round"/>
    <path d="M134 476l10 8-10 8" fill="none" stroke="#172A33" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Modelo -->
    <circle cx="404" cy="484" r="48" fill="#006E74"/>
    <text x="404" y="490" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-weight="700" font-size="17" fill="#FFFFFF">Modelo</text>

    <path d="M276 466h70" stroke="#172A33" stroke-width="3" stroke-linecap="round"/>
    <path d="M340 458l10 8-10 8" fill="none" stroke="#172A33" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="310" y="452" text-anchor="middle" font-size="15" fill="#172A33">solicitud</text>
    <path d="M346 504h-70" stroke="#4D6265" stroke-width="3" stroke-linecap="round"/>
    <path d="M284 496l-10 8 10 8" fill="none" stroke="#4D6265" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="310" y="528" text-anchor="middle" font-size="15" fill="#4D6265">respuesta</text>

    <!-- Planilla -->
    <path d="M210 566v34" stroke="#172A33" stroke-width="3" stroke-linecap="round"/>
    <path d="M200 592l10 12 10-12" fill="none" stroke="#172A33" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="60" y="616" width="360" height="120" rx="12" fill="#FFFFFF" stroke="#778984" stroke-width="2"/>
    <rect x="60" y="616" width="360" height="36" rx="12" fill="#DCECF5"/>
    <rect x="60" y="640" width="360" height="12" fill="#DCECF5"/>
    <g font-size="15" fill="#172A33" text-anchor="middle">
      <text x="105" y="640">Cliente</text>
      <text x="195" y="640">Acción</text>
      <text x="285" y="640">Fecha</text>
      <text x="375" y="640">Monto</text>
    </g>
    <path d="M150 616v120M240 616v120M330 616v120M60 690h360" stroke="#C9D1CE" stroke-width="2"/>
    <g fill="#E8E1D3">
      <rect x="74" y="664" width="62" height="12" rx="6"/><rect x="164" y="664" width="62" height="12" rx="6"/><rect x="254" y="664" width="62" height="12" rx="6"/><rect x="344" y="664" width="62" height="12" rx="6"/>
      <rect x="74" y="706" width="62" height="12" rx="6"/><rect x="164" y="706" width="62" height="12" rx="6"/><rect x="254" y="706" width="62" height="12" rx="6"/><rect x="344" y="706" width="62" height="12" rx="6"/>
    </g>
    <text x="240" y="770" text-anchor="middle" font-size="18" fill="#A94E2B">Una solicitud por nota, sin que nadie intervenga</text>
  </g>
</svg>
