<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 650" role="img" aria-labelledby="t d" font-family="'Source Serif 4', Georgia, serif"><title id="t">La ventana de contexto y lo que la llena</title><desc id="d">Una caja representa la ventana de contexto. Contiene instrucciones, historial, archivos leídos, resultados de herramientas y respuesta; una línea marca el límite. Al pie dice que más contexto no es mejor.</desc><rect width="480" height="650" rx="18" fill="#FFFDF7"/><text x="28" y="48" font-family="Fraunces, Georgia, serif" font-size="24" font-weight="700" fill="#172A33">La memoria de trabajo</text><text x="28" y="76" font-size="17" fill="#4D6265">Todo esto cabe en la ventana de contexto</text><rect x="48" y="112" width="384" height="412" rx="16" fill="#FFF" stroke="#172A33" stroke-width="3"/><g fill="#DCECF5" stroke="#778984" stroke-width="2"><rect x="76" y="142" width="328" height="58" rx="10"/><rect x="76" y="216" width="328" height="72" rx="10"/><rect x="76" y="304" width="328" height="58" rx="10"/><rect x="76" y="378" width="328" height="58" rx="10"/><rect x="76" y="452" width="328" height="46" rx="10"/></g><g font-size="18" fill="#172A33"><text x="96" y="178">Instrucciones</text><text x="96" y="258">Historial de la conversación</text><text x="96" y="340">Archivos leídos</text><text x="96" y="414">Resultados de herramientas</text><text x="96" y="482">Respuesta que escribe</text></g><path d="M48 526h384" stroke="#A94E2B" stroke-width="4"/><text x="240" y="554" text-anchor="middle" font-size="16" fill="#A94E2B">límite de contexto</text><text x="240" y="610" text-anchor="middle" font-size="20" fill="#A94E2B">Más contexto no es mejor</text></svg>
