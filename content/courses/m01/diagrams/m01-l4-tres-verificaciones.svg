<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 680" role="img" aria-labelledby="t d" font-family="'Source Serif 4', Georgia, serif"><title id="t">Tres afirmaciones y tres verificaciones</title><desc id="d">Tres filas muestran: un hecho externo o cita se abre en la fuente primaria; una cifra se recalcula con código; una acción declarada se comprueba con evidencia de herramienta.</desc><rect width="480" height="680" rx="18" fill="#FFFDF7"/><text x="28" y="48" font-family="Fraunces, Georgia, serif" font-size="24" font-weight="700" fill="#172A33">No todo se verifica igual</text><text x="28" y="76" font-size="17" fill="#4D6265">La forma de comprobar depende de la afirmación</text><g fill="#FFF" stroke="#778984" stroke-width="2"><rect x="34" y="118" width="412" height="126" rx="14"/><rect x="34" y="270" width="412" height="126" rx="14"/><rect x="34" y="422" width="412" height="126" rx="14"/></g><g fill="#172A33" font-size="18"><text x="58" y="154" font-family="Fraunces, Georgia, serif" font-weight="700">Hecho externo o cita</text><text x="58" y="184">Abrir la fuente primaria</text><text x="58" y="306" font-family="Fraunces, Georgia, serif" font-weight="700">Cifra</text><text x="58" y="336">Recalcular con código</text><text x="58" y="458" font-family="Fraunces, Georgia, serif" font-weight="700">Acción que dice haber hecho</text><text x="58" y="488">Pedir comando y salida</text></g><g fill="#006E74"><circle cx="390" cy="174" r="30"/><circle cx="390" cy="326" r="30"/><circle cx="390" cy="478" r="30"/></g><g fill="#FFF" text-anchor="middle" font-size="16"><text x="390" y="180">Fuente</text><text x="390" y="332">Código</text><text x="390" y="484">Evidencia</text></g><text x="240" y="616" text-anchor="middle" font-size="18" fill="#A94E2B">El tono seguro no demuestra nada</text></svg>
