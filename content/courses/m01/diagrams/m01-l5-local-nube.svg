<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 616" role="img" aria-labelledby="local-nube-t local-nube-d">
  <title id="local-nube-t">Local frente a nube: tres situaciones</title>
  <desc id="local-nube-d">Tres situaciones apiladas. Uno: un agente corre en tu equipo con un modelo remoto; salen tus instrucciones, lo que lee y sus respuestas. Dos: una sesión en la nube del proveedor; además, tu código se copia a su máquina virtual, donde trabaja con el modelo. Tres: un modelo de pesos abiertos en tu equipo; la inferencia no sale de tu máquina. Solo en la tercera los datos no salen de tu equipo.</desc>
  <rect width="480" height="616" rx="18" fill="#FFFDF7"/>
  <text x="24" y="46" font-family="Fraunces, Georgia, serif" font-size="23" font-weight="700" fill="#172A33">¿Dónde se procesan los datos?</text>
  <rect x="20" y="66" width="440" height="150" rx="14" fill="#FFFFFF" stroke="#778984" stroke-width="2"/>
  <text x="40" y="98" font-family="Fraunces, Georgia, serif" font-size="18" font-weight="700" fill="#172A33">1 · Agente en tu equipo, modelo remoto</text>
  <text x="40" y="122" font-family="'Source Serif 4', Georgia, serif" font-size="15" fill="#A94E2B">Salen tus instrucciones, lo que lee y sus respuestas</text>
  <rect x="40" y="142" width="130" height="52" rx="12" fill="#DCECF5" stroke="#778984" stroke-width="2"/>
  <text x="105" y="173" font-family="'Source Serif 4', Georgia, serif" font-size="16" fill="#172A33" text-anchor="middle">tu equipo</text>
  <path d="M176 168H342" stroke="#172A33" stroke-width="3" stroke-linecap="round"/><path d="M334 159l10 9-10 9" fill="none" stroke="#172A33" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="396" cy="168" r="40" fill="#006E74"/>
  <text x="396" y="173" font-family="Fraunces, Georgia, serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">modelo</text>
  <rect x="20" y="232" width="440" height="150" rx="14" fill="#FFFFFF" stroke="#778984" stroke-width="2"/>
  <text x="40" y="264" font-family="Fraunces, Georgia, serif" font-size="18" font-weight="700" fill="#172A33">2 · Sesión en la nube del proveedor</text>
  <text x="40" y="288" font-family="'Source Serif 4', Georgia, serif" font-size="15" fill="#A94E2B">Además, tu código se copia a su máquina virtual</text>
  <rect x="40" y="308" width="110" height="52" rx="12" fill="#DCECF5" stroke="#778984" stroke-width="2"/>
  <text x="95" y="339" font-family="'Source Serif 4', Georgia, serif" font-size="16" fill="#172A33" text-anchor="middle">tu código</text>
  <path d="M156 334H212" stroke="#172A33" stroke-width="3" stroke-linecap="round"/><path d="M204 325l10 9-10 9" fill="none" stroke="#172A33" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="220" y="294" width="224" height="82" rx="12" fill="#F5F0E6" stroke="#778984" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="236" y="330" font-family="'Source Serif 4', Georgia, serif" font-size="15" fill="#4D6265">máquina</text>
  <text x="236" y="350" font-family="'Source Serif 4', Georgia, serif" font-size="15" fill="#4D6265">virtual</text>
  <circle cx="398" cy="335" r="37" fill="#006E74"/>
  <text x="398" y="340" font-family="Fraunces, Georgia, serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">modelo</text>
  <rect x="20" y="398" width="440" height="150" rx="14" fill="#FFFFFF" stroke="#778984" stroke-width="2"/>
  <text x="40" y="430" font-family="Fraunces, Georgia, serif" font-size="18" font-weight="700" fill="#172A33">3 · Modelo de pesos abiertos en tu equipo</text>
  <text x="40" y="454" font-family="'Source Serif 4', Georgia, serif" font-size="15" fill="#23694D">La inferencia no sale de tu máquina</text>
  <rect x="40" y="460" width="404" height="82" rx="12" fill="#DCECF5" stroke="#778984" stroke-width="2"/>
  <text x="60" y="507" font-family="'Source Serif 4', Georgia, serif" font-size="16" fill="#172A33">tu equipo</text>
  <circle cx="398" cy="501" r="37" fill="#006E74"/>
  <text x="398" y="506" font-family="Fraunces, Georgia, serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">modelo</text>
  <text x="240" y="588" font-family="'Source Serif 4', Georgia, serif" font-size="17" fill="#A94E2B" text-anchor="middle">Solo en la tercera los datos no salen de tu equipo</text>
</svg>
