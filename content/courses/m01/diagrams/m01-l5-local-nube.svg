<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 820" role="img" aria-labelledby="t d" font-family="'Source Serif 4', Georgia, serif"><title id="t">Tres situaciones: local, nube y modelo local</title><desc id="d">Tres situaciones apiladas. Un agente local con modelo remoto envía instrucciones y archivos; una sesión en la nube también copia código a la máquina virtual; un modelo de pesos abiertos local mantiene la inferencia en el equipo.</desc><rect width="480" height="820" rx="18" fill="#FFFDF7"/><text x="28" y="48" font-family="Fraunces, Georgia, serif" font-size="24" font-weight="700" fill="#172A33">¿Dónde se procesan los datos?</text><g fill="#FFF" stroke="#778984" stroke-width="2"><rect x="28" y="86" width="424" height="184" rx="14"/><rect x="28" y="298" width="424" height="184" rx="14"/><rect x="28" y="510" width="424" height="184" rx="14"/></g><g fill="#172A33" font-size="18"><text x="52" y="122" font-family="Fraunces, Georgia, serif" font-weight="700">Agente local + modelo remoto</text><text x="52" y="334" font-family="Fraunces, Georgia, serif" font-weight="700">Sesión en la nube</text><text x="52" y="546" font-family="Fraunces, Georgia, serif" font-weight="700">Modelo de pesos abiertos local</text></g><g fill="#DCECF5" stroke="#778984" stroke-width="2"><rect x="52" y="148" width="130" height="66" rx="10"/><rect x="52" y="360" width="130" height="66" rx="10"/><rect x="52" y="572" width="130" height="66" rx="10"/></g><g fill="#006E74"><circle cx="376" cy="181" r="42"/><circle cx="376" cy="393" r="42"/><circle cx="132" cy="655" r="42"/></g><g font-size="15" text-anchor="middle"><text x="117" y="178" fill="#172A33">tu equipo</text><text x="117" y="202" fill="#172A33">agente</text><text x="376" y="186" fill="#FFF">modelo</text><text x="117" y="390" fill="#172A33">máquina</text><text x="117" y="414" fill="#172A33">virtual</text><text x="376" y="398" fill="#FFF">modelo</text><text x="132" y="660" fill="#FFF">modelo</text></g><g stroke="#172A33" stroke-width="3" fill="none"><path d="M188 181h140m-8-8 10 8-10 8M188 393h140m-8-8 10 8-10 8"/></g><text x="260" y="164" text-anchor="middle" font-size="15" fill="#A94E2B">instrucciones y archivos salen</text><text x="260" y="376" text-anchor="middle" font-size="15" fill="#A94E2B">código e instrucciones salen</text><text x="240" y="734" text-anchor="middle" font-size="18" fill="#A94E2B">Solo la tercera mantiene la inferencia en tu equipo</text></svg>
