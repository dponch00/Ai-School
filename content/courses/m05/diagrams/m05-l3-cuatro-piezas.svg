<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 760" role="img" aria-labelledby="t d" font-family="Source Serif 4, Georgia, serif"><title id="t">Cuatro piezas del encargo de vencidas</title><desc id="d">El encargo de Altiplano dice qué cambiar, no tocar expected ni pruebas existentes, comprobar dos vencidas por región con el snapshot del 19 y entregar el diff, comandos y archivos de prueba tocados.</desc><rect width="480" height="760" rx="18" fill="#FFFDF7"/><text x="28" y="48" font-family="Fraunces, Georgia, serif" font-size="23" font-weight="700" fill="#172A33">Un encargo se puede comprobar</text><text x="28" y="76" font-size="16" fill="#4D6265">Caso: vencidas por región en el dashboard.</text><g fill="#fff" stroke="#778984" stroke-width="2"><rect x="42" y="112" width="396" height="98" rx="13"/><rect x="42" y="235" width="396" height="98" rx="13"/><rect x="42" y="358" width="396" height="98" rx="13"/><rect x="42" y="481" width="396" height="98" rx="13"/></g><g fill="#172A33"><text x="64" y="148" font-family="Fraunces, Georgia, serif" font-size="19" font-weight="700">Qué cambiar</text><text x="64" y="177" font-size="16">Función y tabla de vencidas por región</text><text x="64" y="271" font-family="Fraunces, Georgia, serif" font-size="19" font-weight="700">Qué no tocar</text><text x="64" y="300" font-size="16">expected/ ni pruebas existentes</text><text x="64" y="394" font-family="Fraunces, Georgia, serif" font-size="19" font-weight="700">Cómo comprobar</text><text x="64" y="423" font-size="16">Snapshot del 19: 2 vencidas por región</text><text x="64" y="517" font-family="Fraunces, Georgia, serif" font-size="19" font-weight="700">Qué entregar</text><text x="64" y="546" font-size="16">Diff, comandos, salida y pruebas tocadas</text></g><path d="M240 210v25m0 98v25m0 98v25" stroke="#778984" stroke-width="3" fill="none"/><text x="240" y="664" text-anchor="middle" fill="#A94E2B" font-family="Fraunces, Georgia, serif" font-size="18" font-weight="700">La evidencia no es una afirmación.</text></svg>
