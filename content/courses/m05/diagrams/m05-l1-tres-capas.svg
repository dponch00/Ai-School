<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 710" role="img" aria-labelledby="t d" font-family="Source Serif 4, Georgia, serif"><title id="t">Tres controles para la tabla de vencidas</title><desc id="d">Para agregar la tabla de vencidas, los permisos deciden si una acción pregunta, el sandbox limita qué archivos puede tocar y la red se mantiene apagada salvo para el registro de paquetes.</desc><rect width="480" height="710" rx="18" fill="#FFFDF7"/><text x="28" y="48" font-family="Fraunces, Georgia, serif" font-size="23" font-weight="700" fill="#172A33">Tres controles, tres límites</text><text x="28" y="76" font-size="16" fill="#4D6265">Caso: tabla de vencidas por región.</text><g fill="#fff" stroke="#778984" stroke-width="2"><rect x="48" y="112" width="384" height="98" rx="13"/><rect x="48" y="238" width="384" height="98" rx="13"/><rect x="48" y="364" width="384" height="98" rx="13"/></g><g fill="#172A33"><text x="72" y="148" font-family="Fraunces, Georgia, serif" font-size="20" font-weight="700">Permisos</text><text x="72" y="177" font-size="16">¿Corre solo o pide aprobación?</text><text x="72" y="274" font-family="Fraunces, Georgia, serif" font-size="20" font-weight="700">Sandbox</text><text x="72" y="303" font-size="16">Puede escribir en el proyecto, no en expected/.</text><text x="72" y="400" font-family="Fraunces, Georgia, serif" font-size="20" font-weight="700">Red</text><text x="72" y="429" font-size="16">Apagada; solo registro de paquetes si hace falta.</text></g><path d="M240 210v28m0 98v28" stroke="#778984" stroke-width="3" fill="none"/><rect x="48" y="509" width="384" height="78" rx="13" fill="#DCECF5" stroke="#006E74" stroke-width="3"/><text x="240" y="543" text-anchor="middle" fill="#172A33" font-family="Fraunces, Georgia, serif" font-size="19" font-weight="700">Pruebas y reconciliación: permitidas</text><text x="240" y="568" text-anchor="middle" fill="#4D6265" font-size="16">Enviar cambios: aprobación humana</text><text x="240" y="654" text-anchor="middle" fill="#A94E2B" font-family="Fraunces, Georgia, serif" font-size="18" font-weight="700">Menos privilegio, trabajo suficiente.</text></svg>
