<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 720" role="img" aria-labelledby="t d" font-family="Source Serif 4, Georgia, serif"><title id="t">La nube parte del remoto</title><desc id="d">Las pruebas de duplicados y el README se pueden enviar a la nube desde la rama subida. Las notas locales de FP&amp;A para ajustar el dashboard no viajan al remoto y el trabajo que depende de ellas permanece local.</desc><rect width="480" height="720" rx="18" fill="#FFFDF7"/><text x="28" y="48" font-family="Fraunces, Georgia, serif" font-size="23" font-weight="700" fill="#172A33">La nube no ve tu carpeta</text><text x="28" y="76" font-size="16" fill="#4D6265">Viernes: tres tareas antes del fin de semana.</text><rect x="48" y="112" width="384" height="95" rx="13" fill="#fff" stroke="#778984" stroke-width="2"/><text x="72" y="148" fill="#172A33" font-family="Fraunces, Georgia, serif" font-size="20" font-weight="700">Carpeta local</text><text x="72" y="177" fill="#4D6265" font-size="16">Notas de FP&amp;A sin confirmar</text><path d="M240 207v34" stroke="#778984" stroke-width="3" fill="none"/><path d="M233 232l7 9 7-9" stroke="#778984" stroke-width="3" fill="none"/><rect x="48" y="258" width="384" height="95" rx="13" fill="#DCECF5" stroke="#006E74" stroke-width="3"/><text x="72" y="294" fill="#172A33" font-family="Fraunces, Georgia, serif" font-size="20" font-weight="700">Remoto</text><text x="72" y="323" fill="#4D6265" font-size="16">Rama confirmada y subida con el plan</text><path d="M240 353v34" stroke="#778984" stroke-width="3" fill="none"/><path d="M233 378l7 9 7-9" stroke="#778984" stroke-width="3" fill="none"/><rect x="48" y="404" width="384" height="120" rx="13" fill="#fff" stroke="#778984" stroke-width="2"/><text x="72" y="440" fill="#172A33" font-family="Fraunces, Georgia, serif" font-size="20" font-weight="700">Sesión en la nube</text><text x="72" y="469" fill="#4D6265" font-size="16">Pruebas de duplicados y README: sí</text><text x="72" y="496" fill="#4D6265" font-size="16">Ajuste con notas locales: no</text><text x="240" y="607" text-anchor="middle" fill="#A94E2B" font-family="Fraunces, Georgia, serif" font-size="18" font-weight="700">A la nube viaja lo escrito.</text></svg>
