<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 720" role="img" aria-labelledby="t d" font-family="Source Serif 4, Georgia, serif"><title id="t">Depurar sin acumular intentos</title><desc id="d">El dashboard muestra tres vencidas en el Centro donde deberían ser dos. El ciclo reproduce el fallo, formula una hipótesis, corrige y verifica; si no se resuelve y ya corregiste más de dos veces lo mismo, se para y se abre una sesión nueva con el comando que reproduce el fallo, lo descartado y la hipótesis.</desc><rect width="480" height="720" rx="18" fill="#FFFDF7"/><text x="28" y="48" font-family="Fraunces, Georgia, serif" font-size="23" font-weight="700" fill="#172A33">Depurar sin acumular ruido</text><text x="28" y="76" font-size="16" fill="#4D6265">Centro: muestra 3 vencidas; deberían ser 2.</text><g fill="#fff" stroke="#778984" stroke-width="2"><rect x="48" y="112" width="384" height="74" rx="13"/><rect x="48" y="211" width="384" height="74" rx="13"/><rect x="48" y="310" width="384" height="74" rx="13"/><rect x="48" y="409" width="384" height="74" rx="13"/></g><g fill="#172A33" font-family="Fraunces, Georgia, serif" font-size="20" font-weight="700"><text x="72" y="157">1 · Reproducir</text><text x="72" y="256">2 · Formular hipótesis</text><text x="72" y="355">3 · Corregir</text><text x="72" y="454">4 · Verificar</text></g><path d="M240 186v25m0 74v25m0 74v25" stroke="#778984" stroke-width="3" fill="none"/><path d="M432 446H458V149H442" stroke="#4D6265" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M450 140l-10 9 10 9" stroke="#4D6265" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M240 483v74" stroke="#4D6265" stroke-width="3" stroke-dasharray="6 6"/><text x="252" y="526" fill="#4D6265" font-size="16">si no se resuelve</text><rect x="48" y="567" width="384" height="72" rx="13" fill="#DCECF5" stroke="#006E74" stroke-width="3"/><text x="240" y="601" text-anchor="middle" fill="#172A33" font-family="Fraunces, Georgia, serif" font-size="19" font-weight="700">Más de dos correcciones: parar</text><text x="240" y="626" text-anchor="middle" fill="#4D6265" font-size="16">Sesión nueva con fallo, descartes e hipótesis</text><text x="240" y="682" text-anchor="middle" fill="#A94E2B" font-family="Fraunces, Georgia, serif" font-size="18" font-weight="700">Parar también es avanzar.</text></svg>
