<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 745" role="img" aria-labelledby="t d" font-family="Source Serif 4, Georgia, serif">
  <title id="t">Qué grader corresponde a cada criterio</title>
  <desc id="d">En la rúbrica del comentario, el código comprueba R1, R3 y R4 contra kpis.json o palabras. R2 necesita un modelo calibrado o una persona porque decide si una causa tiene un dato detrás. La persona valida y decide lo que no pueden resolver código ni modelo.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#172A33" stroke-width="2"/></marker></defs>
  <rect width="480" height="745" rx="18" fill="#FFFDF7"/>
  <text x="28" y="46" font-family="Fraunces, Georgia, serif" font-size="23" font-weight="700" fill="#172A33">El grader depende del criterio</text>
  <text x="28" y="73" font-size="16" fill="#4D6265">Caso: rúbrica del comentario del comité.</text>
  <rect x="42" y="106" width="396" height="119" rx="13" fill="#006E74"/>
  <text x="63" y="139" font-family="Fraunces, Georgia, serif" font-size="20" font-weight="700" fill="#fff">Código primero</text><text x="63" y="165" font-size="16" fill="#fff">R1 cifras, R3 vencidas y R4 palabras</text><text x="63" y="189" font-size="15" fill="#fff">Rápido, barato, objetivo y repetible</text><text x="63" y="211" font-size="15" fill="#fff">Contra kpis.json o contando palabras</text>
  <path d="M240 225v30" stroke="#172A33" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <rect x="42" y="270" width="396" height="118" rx="13" fill="#DCECF5" stroke="#778984" stroke-width="2"/>
  <text x="63" y="303" font-family="Fraunces, Georgia, serif" font-size="20" font-weight="700" fill="#172A33">Modelo calibrado</text><text x="63" y="329" font-size="16" fill="#172A33">R2: ¿cada causa tiene un dato detrás?</text><text x="63" y="353" font-size="15" fill="#4D6265">Flexible, pero se calibra con etiquetas humanas</text><text x="63" y="375" font-size="15" fill="#4D6265">Admite «no se puede determinar»</text>
  <path d="M240 388v30" stroke="#172A33" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <rect x="42" y="433" width="396" height="116" rx="13" fill="#fff" stroke="#778984" stroke-width="2"/>
  <text x="63" y="466" font-family="Fraunces, Georgia, serif" font-size="20" font-weight="700">Persona</text><text x="63" y="492" font-size="16">Valida y decide cuando no hay otra opción</text><text x="63" y="516" font-size="15" fill="#4D6265">Referencia de calidad; cara y lenta</text>
  <path d="M240 549v30" stroke="#4D6265" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <rect x="42" y="594" width="396" height="56" rx="13" fill="#F5F0E6" stroke="#778984" stroke-width="2"/>
  <text x="240" y="629" text-anchor="middle" font-size="16">El criterio crítico siempre es binario.</text>
  <text x="240" y="704" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="700" fill="#A94E2B">No se compensa un criterio crítico.</text>
</svg>
