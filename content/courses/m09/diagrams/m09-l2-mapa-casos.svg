<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 860" role="img" aria-labelledby="t d" font-family="Source Serif 4, Georgia, serif">
  <title id="t">Mapa de casos para evaluar el comentario</title>
  <desc id="d">El conjunto de Altiplano combina un caso normal, uno límite, una semana sin cambios, datos incompletos y un caso adversarial. Un fallo real se reproduce con datos sintéticos y se incorpora como caso de regresión.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#172A33" stroke-width="2"/></marker></defs>
  <rect width="480" height="860" rx="18" fill="#FFFDF7"/>
  <text x="28" y="46" font-family="Fraunces, Georgia, serif" font-size="23" font-weight="700" fill="#172A33">Un conjunto protege por varios lados</text>
  <text x="28" y="73" font-size="16" fill="#4D6265">Caso: el comentario semanal de Altiplano.</text>
  <g fill="#fff" stroke="#778984" stroke-width="2"><rect x="42" y="107" width="396" height="79" rx="13"/><rect x="42" y="201" width="396" height="79" rx="13"/><rect x="42" y="295" width="396" height="79" rx="13"/><rect x="42" y="389" width="396" height="79" rx="13"/><rect x="42" y="483" width="396" height="79" rx="13"/></g>
  <g fill="#172A33"><text x="63" y="135" font-family="Fraunces, Georgia, serif" font-size="18" font-weight="700">Normal</text><text x="63" y="159" font-size="15">Snapshot del 19; seis vencidas, dos por región</text><text x="63" y="229" font-family="Fraunces, Georgia, serif" font-size="18" font-weight="700">Límite</text><text x="63" y="253" font-size="15">OPP-1021 sin fecha; OPP-1012 duplicada</text><text x="63" y="323" font-family="Fraunces, Georgia, serif" font-size="18" font-weight="700">Sin cambios</text><text x="63" y="347" font-size="15">«Sin variaciones relevantes», sin causas</text><text x="63" y="417" font-family="Fraunces, Georgia, serif" font-size="18" font-weight="700">Datos incompletos</text><text x="63" y="441" font-size="15">Código 2: no redactar; pedir el supuesto</text><text x="63" y="511" font-family="Fraunces, Georgia, serif" font-size="18" font-weight="700">Adversarial</text><text x="63" y="535" font-size="15">Instrucción escondida: ignorar y revisar</text></g>
  <path d="M240 562v30" stroke="#172A33" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <rect x="42" y="607" width="396" height="73" rx="13" fill="#DCECF5" stroke="#778984" stroke-width="2"/>
  <text x="63" y="636" font-family="Fraunces, Georgia, serif" font-size="18" font-weight="700" fill="#172A33">Fallo real reproducido</text><text x="63" y="660" font-size="15" fill="#172A33">Según su ficha y con datos sintéticos</text>
  <path d="M240 680v30" stroke="#172A33" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <rect x="42" y="725" width="396" height="61" rx="13" fill="#fff" stroke="#778984" stroke-width="2"/>
  <text x="240" y="753" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="18" font-weight="700" fill="#172A33">Caso de regresión</text><text x="240" y="775" text-anchor="middle" font-size="15" fill="#4D6265">Comprueba que el error no vuelva.</text>
  <text x="240" y="831" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="17" font-weight="700" fill="#A94E2B">Cada caso lleva solución de referencia.</text>
</svg>
