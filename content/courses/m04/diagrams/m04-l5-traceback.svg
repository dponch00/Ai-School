<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 690" role="img" aria-labelledby="t d" font-family="Source Serif 4, Georgia, serif"><title id="t">Leer un traceback de abajo hacia arriba</title><desc id="d">Un traceback del pipeline muestra arriba el recorrido de archivos y abajo el tipo de error y su mensaje; al subir, el primer archivo del proyecto es el mejor lugar para empezar a mirar.</desc><rect width="480" height="690" rx="18" fill="#FFFDF7"/><text x="28" y="48" font-family="Fraunces, Georgia, serif" font-size="23" font-weight="700" fill="#172A33">El traceback se lee al revés</text><text x="28" y="76" font-size="16" fill="#4D6265">De la última línea hacia el archivo del proyecto.</text><rect x="48" y="112" width="384" height="98" rx="13" fill="#172A33"/><text x="72" y="149" fill="#DCECF5" font-size="16">archivo de una biblioteca</text><text x="72" y="181" fill="#FFFDF7" font-size="17">... por dónde pasó la ejecución</text><rect x="48" y="232" width="384" height="98" rx="13" fill="#fff" stroke="#778984" stroke-width="2"/><text x="72" y="269" fill="#172A33" font-family="Fraunces, Georgia, serif" font-size="19" font-weight="700">pipeline_kpis.py · línea 42</text><text x="72" y="298" fill="#4D6265" font-size="16">Primer archivo que pertenece al proyecto</text><rect x="48" y="352" width="384" height="98" rx="13" fill="#fff" stroke="#A53636" stroke-width="3"/><text x="72" y="389" fill="#A53636" font-size="16" font-weight="700">ÚLTIMA LÍNEA</text><text x="72" y="420" fill="#172A33" font-family="Fraunces, Georgia, serif" font-size="18" font-weight="700">Tipo de excepción y mensaje</text><path d="M240 538V480" stroke="#4D6265" stroke-width="3" fill="none"/><path d="M233 489l7-9 7 9" stroke="#4D6265" stroke-width="3" fill="none"/><text x="240" y="572" text-anchor="middle" fill="#4D6265" font-size="17">Sube desde qué pasó hasta dónde mirar.</text><text x="240" y="638" text-anchor="middle" fill="#A94E2B" font-family="Fraunces, Georgia, serif" font-size="18" font-weight="700">El mensaje es una pista, no la corrección.</text></svg>
