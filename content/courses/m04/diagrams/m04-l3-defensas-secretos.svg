<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 700" role="img" aria-labelledby="t d" font-family="Source Serif 4, Georgia, serif"><title id="t">Defensas para el token de Altiplano</title><desc id="d">El token del CRM se puede detectar antes del commit con un escáner o hook, en integración continua y al enviar al servidor con protección de envíos; las capas se combinan porque ninguna detecta todo.</desc><rect width="480" height="700" rx="18" fill="#FFFDF7"/><text x="28" y="48" font-family="Fraunces, Georgia, serif" font-size="23" font-weight="700" fill="#172A33">¿Dónde se detiene un secreto?</text><text x="28" y="76" font-size="16" fill="#4D6265">Caso: un token del CRM entra por error en .env.</text><rect x="48" y="112" width="384" height="78" rx="13" fill="#DCECF5" stroke="#006E74" stroke-width="3"/><text x="240" y="160" text-anchor="middle" fill="#172A33" font-family="Fraunces, Georgia, serif" font-size="20" font-weight="700">Cambio en .env</text><path d="M240 190v34" stroke="#778984" stroke-width="3" fill="none"/><path d="M233 215l7 9 7-9" stroke="#778984" stroke-width="3" fill="none"/><g fill="#fff" stroke="#778984" stroke-width="2"><rect x="48" y="241" width="384" height="80" rx="13"/><rect x="48" y="351" width="384" height="80" rx="13"/><rect x="48" y="461" width="384" height="80" rx="13"/></g><g fill="#172A33"><text x="70" y="276" font-family="Fraunces, Georgia, serif" font-size="20" font-weight="700">Antes del commit</text><text x="70" y="302" font-size="16">Escáner y hook pre-commit</text><text x="70" y="386" font-family="Fraunces, Georgia, serif" font-size="20" font-weight="700">Integración continua</text><text x="70" y="412" font-size="16">Escáner del cambio ya creado</text><text x="70" y="496" font-family="Fraunces, Georgia, serif" font-size="20" font-weight="700">Servidor</text><text x="70" y="522" font-size="16">Protección de envíos bloquea el push</text></g><path d="M240 321v30m0 80v30" stroke="#778984" stroke-width="3" fill="none"/><text x="240" y="620" text-anchor="middle" fill="#A94E2B" font-family="Fraunces, Georgia, serif" font-size="18" font-weight="700">Las capas se combinan; ninguna basta sola.</text></svg>
