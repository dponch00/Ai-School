<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 780" role="img" aria-labelledby="t d" font-family="Source Serif 4, Georgia, serif"><title id="t">Tres lugares para un cambio en Git</title><desc id="d">El cambio del operador de trimestre pasa por carpeta de trabajo, índice y commit. Restore recupera un archivo, revert crea un commit que deshace otro y reset reescribe la historia.</desc><rect width="480" height="780" rx="18" fill="#FFFDF7"/><text x="28" y="48" font-family="Fraunces, Georgia, serif" font-size="23" font-weight="700" fill="#172A33">¿Dónde está cada cambio?</text><text x="28" y="76" font-size="16" fill="#4D6265">El operador de trimestre recorre tres lugares.</text><g fill="#fff" stroke="#778984" stroke-width="2"><rect x="48" y="112" width="384" height="86" rx="13"/><rect x="48" y="238" width="384" height="86" rx="13"/><rect x="48" y="364" width="384" height="86" rx="13"/></g><g fill="#172A33"><text x="72" y="148" font-family="Fraunces, Georgia, serif" font-size="20" font-weight="700">Carpeta de trabajo</text><text x="72" y="175" font-size="16">Modificado: &lt; cambió el límite</text><text x="72" y="274" font-family="Fraunces, Georgia, serif" font-size="20" font-weight="700">Índice</text><text x="72" y="301" font-size="16">Preparado para el próximo commit</text><text x="72" y="400" font-family="Fraunces, Georgia, serif" font-size="20" font-weight="700">Commit</text><text x="72" y="427" font-size="16">Confirmado en la historia</text></g><path d="M240 198v40m0 86v40" stroke="#778984" stroke-width="3" fill="none"/><rect x="48" y="503" width="384" height="150" rx="13" fill="#DCECF5" stroke="#006E74" stroke-width="3"/><text x="72" y="538" fill="#172A33" font-family="Fraunces, Georgia, serif" font-size="19" font-weight="700">Tres formas de deshacer</text><text x="72" y="571" fill="#4D6265" font-size="16">restore: recupera un archivo</text><text x="72" y="598" fill="#4D6265" font-size="16">revert: crea otro commit</text><text x="72" y="625" fill="#4D6265" font-size="16">reset: reescribe la historia</text><text x="240" y="721" text-anchor="middle" fill="#A94E2B" font-family="Fraunces, Georgia, serif" font-size="18" font-weight="700">Confirmar crea un punto seguro.</text></svg>
