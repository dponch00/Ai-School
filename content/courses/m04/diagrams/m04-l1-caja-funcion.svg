<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 720" role="img" aria-labelledby="t d" font-family="Source Serif 4, Georgia, serif"><title id="t">Una condición cambia el cierre del trimestre</title><desc id="d">La función recibe una fecha y decide si cae en el cuarto trimestre. Con menor o igual, el 31 de diciembre devuelve verdadero; con menor estricto, devuelve falso y excluye la oportunidad OPP-1038 del Sur.</desc><rect width="480" height="720" rx="18" fill="#FFFDF7"/><text x="28" y="48" font-family="Fraunces, Georgia, serif" font-size="23" font-weight="700" fill="#172A33">Un carácter cambia una salida</text><text x="28" y="76" font-size="16" fill="#4D6265">La función del trimestre recibe una fecha.</text><rect x="48" y="112" width="384" height="94" rx="13" fill="#DCECF5" stroke="#006E74" stroke-width="3"/><text x="72" y="149" fill="#172A33" font-family="Fraunces, Georgia, serif" font-size="20" font-weight="700">Entrada</text><text x="72" y="178" fill="#4D6265" font-size="17">value = 2026-12-31</text><path d="M240 206v35" stroke="#778984" stroke-width="3" fill="none"/><path d="M233 232l7 9 7-9" stroke="#778984" stroke-width="3" fill="none"/><rect x="48" y="258" width="384" height="105" rx="13" fill="#fff" stroke="#778984" stroke-width="2"/><text x="72" y="294" fill="#172A33" font-family="Fraunces, Georgia, serif" font-size="19" font-weight="700">Condición de frontera</text><text x="72" y="325" fill="#4D6265" font-size="17">2026-10-01 ≤ value ≤ 2026-12-31</text><path d="M240 363v35" stroke="#778984" stroke-width="3" fill="none"/><path d="M233 389l7 9 7-9" stroke="#778984" stroke-width="3" fill="none"/><rect x="48" y="415" width="384" height="102" rx="13" fill="#fff" stroke="#23694D" stroke-width="3"/><text x="72" y="451" fill="#23694D" font-size="16" font-weight="700">CON ≤</text><text x="72" y="481" fill="#172A33" font-family="Fraunces, Georgia, serif" font-size="19" font-weight="700">True · OPP-1038 cuenta</text><rect x="48" y="538" width="384" height="102" rx="13" fill="#fff" stroke="#A53636" stroke-width="3"/><text x="72" y="574" fill="#A53636" font-size="16" font-weight="700">CON &lt;</text><text x="72" y="604" fill="#172A33" font-family="Fraunces, Georgia, serif" font-size="19" font-weight="700">False · OPP-1038 queda fuera</text><text x="240" y="687" text-anchor="middle" fill="#A94E2B" font-family="Fraunces, Georgia, serif" font-size="18" font-weight="700">El límite se prueba a mano.</text></svg>
